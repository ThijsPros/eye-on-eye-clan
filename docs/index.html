<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eye on Eye Clan</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://api.github.com https://*.workers.dev; img-src data: https://api-assets.clashofclans.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#12337A">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/rubik-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:500;src:url(fonts/rubik-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:700;src:url(fonts/rubik-latin-700-normal.woff2) format("woff2");font-display:swap}

:root{
 --night:#12337A;--night-deep:#0C2559;--gold:#F2B632;--on-night:#FFFFFF;--on-night-soft:#C4D2EE;
 --page:#E8EDF5;--surface:#FFFFFF;--ink:#14203A;--muted:#55607A;--line:#D3DAE6;--star:#946100;
 --good:#17804A;--bad:#C2332B;
 --c1:#F2B632;--c1t:#3A2800;--c2:#2F7DE1;--c2t:#FFFFFF;--c3:#CF3F35;--c3t:#FFFFFF;--c4:#238A5C;--c4t:#FFFFFF;
 --display:"Lilita One","Arial Black",Arial,sans-serif;--body:Rubik,"Segoe UI",Arial,sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --night:#17408F;--night-deep:#102F70;--page:#0E1830;--surface:#172444;--ink:#EAF0FB;--muted:#A6B3CE;--line:#2C3B63;--star:#F2B632;
 --good:#62CF95;--bad:#FF9A92;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:3px}
.inner{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left))}

/* De muur: blauwe kop met kantelen als enige blikvanger. */
.wall{position:relative;background:var(--night);color:var(--on-night);padding-bottom:44px}
.wall.laag{padding-bottom:30px}
.wall::after{content:"";position:absolute;inset:auto 0 0;height:22px;background:repeating-linear-gradient(90deg,var(--page) 0 30px,transparent 30px 66px)}
.top{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;letter-spacing:.01em}
.nav{display:flex;gap:4px}
.nav button{all:unset;cursor:pointer;font:400 18px/1 var(--display);padding:10px 14px;border-radius:6px;color:var(--on-night-soft)}
.nav button[aria-current="page"]{background:var(--gold);color:#2B1E00}
.nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.fresh{font-size:14px;color:var(--on-night-soft);margin:0}
.warhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;margin:14px 0 6px}
.warhead h2{font-size:34px}

.logo{display:block;object-fit:contain;flex:none}
.front{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.kol{display:flex;flex-direction:column;gap:10px;background:var(--night-deep);border-radius:8px;padding:14px;min-width:0}
.kolkop{display:flex;align-items:center;gap:10px;min-height:60px}
.kolkop h3{font-size:22px}
.kolkop p{margin:2px 0 0;font-size:13px;line-height:1.25;color:var(--on-night-soft)}
.tegen{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;border-top:1px solid rgb(255 255 255/.16);padding-top:10px}
.tegen b{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.2}
.tegen span{display:block;font-size:13px;color:var(--on-night-soft)}
.rondes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rondes button{all:unset;box-sizing:border-box;text-align:center;font:400 16px/30px var(--display);height:32px;border-radius:4px;background:rgb(255 255 255/.08);color:var(--on-night-soft);cursor:pointer}
.rondes button[disabled]{cursor:default;opacity:.55}
.rondes .bezig{background:#2F7DE1;color:#fff}
.rondes .voor{background:#E58A1F;color:#2B1400}
.rondes .win{background:#17804A;color:#fff}
.rondes .ver{background:#C2332B;color:#fff}
.rondes .open{background:#6B7488;color:#fff}
.rondes button[aria-current]{box-shadow:0 0 0 2px var(--night-deep),0 0 0 4px #fff}
.rondes button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;text-align:center;font-size:15px}
.score .lab{font-size:12px;color:var(--on-night-soft)}
.pil{font:400 30px/1.2 var(--display);border-radius:5px;padding:2px 0}
.pil.wij{background:#2F7DE1;color:#fff}
.pil.zij{background:#C2332B;color:#fff}
.met{display:grid;gap:3px}
.balk{display:block;height:7px;border-radius:2px;background:rgb(255 255 255/.14);overflow:hidden}
.balk i{display:block;height:100%;background:#4C93EE}
.balk.zij i{background:#E5574C}
.timer{display:grid;gap:1px;text-align:center;font-size:13px;color:var(--on-night-soft);background:rgb(255 255 255/.07);border-radius:6px;padding:7px 8px}
.timer b{font:400 22px/1.15 var(--display);color:var(--on-night)}
.leden{list-style:none;margin:6px 0 0;padding:0}
.leden li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:7px;align-items:center;padding:4px 0;border-top:1px solid rgb(255 255 255/.1);color:var(--on-night)}
.rang{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgb(255 255 255/.14)}
.rang.ja{background:#17804A;color:#fff}
.rang.nee{background:#C2332B;color:#fff}
.ats{display:grid;gap:1px}
.aanval{display:grid;grid-template-columns:62px 32px;align-items:center;gap:3px}
.aanval small{font-size:12px;color:var(--on-night-soft);text-align:right}
.st{font-size:20px;letter-spacing:0;line-height:1.1}
.st.s3{color:#6FE0A6}.st.s2{color:var(--gold)}.st.s1{color:#FF9A4D}.st.leeg{color:rgb(255 255 255/.32)}
.oordeel{margin:0;padding:7px 10px;border-radius:6px;font-weight:700;text-align:center;font-size:15px}
.oordeel.win{background:var(--gold);color:#2B1E00}
.oordeel.ver{background:#C2332B;color:#fff}
.oordeel.open{background:rgb(255 255 255/.12);color:var(--on-night)}
.klok{margin:0;font-size:14px;color:var(--on-night-soft)}
details.open{font-size:14px}
details.open summary{cursor:pointer;font-weight:500;color:var(--on-night);padding-block:3px}
.rust{margin:0;color:var(--on-night-soft)}

main{display:block;padding-block:22px 40px}
main:empty{padding-block:6px}
.sectie{display:grid;gap:14px;min-width:0}
.sectie+.sectie{margin-top:30px}
.sectie>h2{font-size:26px}

/* Clans: rijen met schild, geen losse kaartjes. */
.clans{background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.clan{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:52px minmax(0,1.3fr) repeat(3,minmax(84px,1fr));gap:4px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.clan:first-child{border-top:0}
.clan .kop{display:block}.cn{display:block;font:400 21px/1.1 var(--display)}
.clan .rol{display:block;color:var(--muted);font-size:14px}
.clan:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.feit{display:block;font-size:14px;color:var(--muted)}
.feit b{display:block;font:500 17px/1.2 var(--body);color:var(--ink)}
.feit b.ster{color:var(--star)}
.waarschuwing{margin:0;color:#FFB4AD;font-size:13px}
.shield{display:block}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#zoek{flex:1 1 180px;max-width:300px}
.teller{color:var(--muted);font-size:14px}
.uitleg{margin:0;color:var(--muted);font-size:14px;max-width:72ch}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 13px/1.2 var(--body);text-align:left;color:var(--muted);border-bottom:2px solid var(--line);padding:0;white-space:nowrap}
th button{all:unset;cursor:pointer;display:block;padding:10px 8px}
th.n,td.n{text-align:right}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.speler{display:flex;align-items:center;gap:8px;min-width:0}
.naam{all:unset;cursor:pointer;font-weight:500;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.naam:focus-visible{outline:3px solid var(--gold)}
.d{display:block;font-size:12px;line-height:1.1;color:var(--muted)}
.d.up{color:var(--good)}.d.down{color:var(--bad)}
.kort{display:none}
.tal{font-weight:700}
.tal.bad{color:var(--bad)}
.ster{color:var(--star);font-weight:500}
.weg{color:var(--muted);font-size:13px}
.detail td{white-space:normal;background:color-mix(in srgb,var(--night) 6%,var(--surface))}
.dgrid{display:flex;flex-wrap:wrap;gap:12px 28px;padding:6px 0}
.spark{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.spark svg{display:block;width:140px;height:38px;color:var(--c2)}
.spark polyline{fill:none;stroke:currentColor;stroke-width:1.8}
.spark circle{fill:currentColor}
.spark b{color:var(--ink);font-weight:500}

.lijst{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.uitslag{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.uitslag:first-child{border-top:0}
.uitslag .wie b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uitslag .wie span{display:block;color:var(--muted);font-size:14px}
.uitslag .sc{font:400 24px/1 var(--display);text-align:right}
.uitslag .sc.win{color:var(--good)}.uitslag .sc.ver{color:var(--bad)}
.uitslag .sc small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}

.berichten{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.bericht{display:grid;gap:8px;min-width:0}
.bericht h3{font-size:20px}
textarea{width:100%;resize:vertical;font:inherit;font-size:15px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.knop{all:unset;cursor:pointer;justify-self:start;font-weight:500;background:var(--night);color:#fff;border-radius:6px;padding:9px 14px}
.knop:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kort,.kp{font:inherit}
th .kp{display:block;padding:10px 8px}
.vakken{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:start}
.vak{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.vakkop{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.vak h3{font-size:21px}
.vak ol{list-style:none;margin:0;padding:0}
.vak li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:36px;border-top:1px solid var(--line)}
.vak li select{width:100%}
.vak .nr{font:400 16px/1 var(--display);color:var(--muted);text-align:right}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.letop{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:10px 14px}
.letop h3{font-size:18px}.letop ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.reserve summary{cursor:pointer;font-weight:500}.reserve p{margin:6px 0 0;color:var(--muted);max-width:90ch}
.sleutel[hidden]{display:none}
.sleutel{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sleutel input{flex:1 1 220px;max-width:420px}
.knop.licht{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.knop[disabled]{opacity:.5;cursor:default}
.cwlgroep{display:grid;gap:8px;min-width:0}
.cwlstand tr.wij td{background:color-mix(in srgb,#2F7DE1 13%,var(--surface));font-weight:500}
.rs{display:inline-grid;min-width:32px;text-align:center;border-radius:4px;padding:2px 3px;background:color-mix(in srgb,var(--muted) 18%,transparent)}
.rs b{font-weight:500;font-size:15px;line-height:1.1}.rs small{font-size:11px;line-height:1.1;opacity:.85}
.rs.w{background:#17804A;color:#fff}.rs.g{background:#6B7488;color:#fff}.rs.v{background:#C2332B;color:#fff}.rs.bezig{background:#2F7DE1;color:#fff}
.plek{white-space:nowrap}.pijl{display:inline-block;width:14px;color:var(--muted)}
.cwlstand tr.op .pijl{color:var(--good)}.cwlstand tr.neer .pijl{color:var(--bad)}
.cwlstand tr.op td:first-child{box-shadow:inset 4px 0 0 var(--good)}.cwlstand tr.neer td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.vooruit{margin:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.vooruit b{font-weight:700}.vooruit b.ja,.vz.ja{color:var(--good)}.vooruit b.nee,.vz.nee{color:var(--bad)}
.vz{font-size:13px;font-weight:500}
.melding{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:6px;padding:10px 14px;margin:0}
footer{padding-block:0 28px;color:var(--muted);font-size:13px}

@media (max-width:1040px){
 .front{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-bottom:6px}
 .kol{flex:0 0 min(320px,88%);scroll-snap-align:start}
}
@media (max-width:720px){
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
 .nav{position:fixed;z-index:5;inset:auto 0 0;background:var(--night-deep);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .nav{gap:2px}
 .nav button{flex:1;text-align:center;font-size:14.5px;padding:12px 1px}
 .wall{padding-bottom:40px}
 .wall.laag{padding-bottom:26px}
 .warhead h2{font-size:28px}
 .clan{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px 10px}
 .clan .kop{grid-column:2/-1}
 .clan .feit:nth-of-type(1){grid-column:2}
 .opt{display:none}
 .naam{max-width:80px}
 td,th button{padding-inline:5px}
 .kort{display:inline}.lang{display:none}
 .cwlstand .sn{max-width:118px}
 td:first-child,th:first-child button{padding-left:8px}
 td:last-child,th:last-child button{padding-right:8px}
}
@media (max-width:380px){.naam{max-width:86px}}
@media (prefers-reduced-motion:no-preference){
 .tug i{transition:width .5s ease}
}
</style>
</head>
<body>
<header class="wall">
 <div class="inner">
  <div class="top">
   <div class="brand"><svg id="merklogo" class="shield" width="30" height="34" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="#F2B632"/><circle cx="20" cy="22" r="9" fill="#12337A"/><circle cx="20" cy="22" r="4" fill="#fff"/></svg><h1 id="merknaam">Eye on Eye Clan</h1></div>
   <nav class="nav" id="nav" aria-label="Onderdelen"></nav>
  </div>
  <div id="muur"></div>
 </div>
</header>
<main class="inner" id="inhoud" tabindex="-1"></main>
<footer class="inner"><span id="voet"></span>Fan-pagina, niet verbonden aan of goedgekeurd door Supercell. Gegevens uit de Clash of Clans API. Oorlogsgeschiedenis en clandatums via <a href="https://clashk.ing">ClashKing</a>.</footer>
<script>
const TABS=[["overzicht","Status"],["spelers","Leden"],["opstelling","Opstelling"],["oorlogen","Oorlogen"],["berichten","Berichten"]];
const LEIDING_URL="https://api.github.com/repos/ThijsPros/eye-on-eye-clan/contents/docs/data/leiding.json";
const KEUZES=["Zekerheid","Ja","Twijfel","Nee"];
const VAKKEN=[{nr:1,van:1,tot:15},{nr:2,van:101,tot:115},{nr:3,van:16,tot:30}];
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const iso=s=>s?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`:null;
const datum=s=>{if(!s)return"–";const[y,m,d]=s.slice(0,10).split("-");return `${+d} ${MND[m-1]} ${y}`};
const tijd=s=>s?new Date(`${iso(s)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}Z`):null;
const klok=d=>d.toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const duur=d=>{const m=Math.max(0,Math.round((d-Date.now())/6e4)),u=Math.floor(m/60);return u?`${u} uur ${m%60} min`:`${m} min`};
const ROMEINS=["","I","II","III","IV"];
let D,oorlogClan="",liveUrl=null,liveTijd=null,liveUit=false,rondeKeuze={},dichteLijst=new Set,L={spelers:{}},bewerk=false,sha=null,gewijzigd=0,oorlogZoek="",opslagMelding="",tab="overzicht",sort={k:"lgn",dir:-1},zoek="",filter="",clanFilter="",open=new Set;
const clanVan=t=>D.clans.find(c=>c.tag===t);
function schild(nr,maat=40){const c=nr?D?.clans.find(x=>x.nr===nr):null;
 if(c?.logo)return `<img class="logo" src="${esc(c.logo)}" width="${maat}" height="${maat}" alt="${esc(c.naam)}" loading="lazy">`;
 return `<svg class="shield" width="${maat}" height="${maat*1.15}" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/></svg>`}
const tegenLogo=(w,maat)=>w.tegenstander.logo?`<img class="logo" src="${esc(w.tegenstander.logo)}" width="${maat}" height="${maat}" alt="">`:"";

const aanv=p=>p.cw?.aanv??0;
const gem=p=>p.cw?.gem??null;
// De grens telt pas als er een volledige periode aan oorlogen is opgeslagen.
const laag=p=>D.vensterVol&&(p.cw?.moest??0)<D.grensAanvallen;
const pid=p=>p.tag.slice(1), K=p=>L.spelers[pid(p)]||{};
const plekNaam=n=>{if(n==null)return"";const v=VAKKEN.find(x=>n>=x.van&&n<=x.tot);return v?`Clan ${ROMEINS[v.nr]}, plek ${n-v.van+1}`:""};
const COLS=[["naam","Speler"],["sinds","Bij ons sinds",0,1],["th","TH",1,1],["lgn","League"],["helden","Helden",1,1],["dieren","Dieren",1,1],["equip","Equipment",1,1],["moest","Moest doen",1,0,"Moest"],["gemis","Niet gedaan",1,0,"Mis"],["gem","Gem ★",1]];
const waarde=(p,k)=>k==="moest"?(p.cw?.moest??0):k==="gem"?gem(p):k==="gemis"?(p.cw?.gemis??0):p[k];

const soortNaam=w=>w.soort==="cwl"?`CWL ronde ${w.ronde??"?"}`:"Clanoorlog";
function oordeel(w){const a=w.clan.stars||0,b=w.tegenstander.stars||0;
 if(w.status==="warEnded"){const x=w.clan.destructionPercentage,y=w.tegenstander.destructionPercentage;if(a>b||(a===b&&x>y))return ["win","Gewonnen"];if(a<b||(a===b&&x<y))return ["ver","Verloren"];return ["open","Gelijkspel"]}
 if(w.maxZij==null)return null;

 return `<div class="spark"><span>${label}: <b>${vs[0]} → ${l[1]}</b></span><svg viewBox="0 0 140 38" role="img" aria-label="${label} van ${vs[0]} naar ${l[1]}"><polyline points="${pts.map(q=>X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1)).join(" ")}"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="2.6"/></svg></div>`}
function detail(p,cols){const f=(k,v)=>`<div class="feit"><b>${esc(v??"–")}</b>${k}</div>`,c=p.cw||{};
 return `<tr class="detail"><td colspan="${cols}"><div class="dgrid">${spark(p,0,"Helden")}${spark(p,1,"Dieren")}${spark(p,2,"Equipment")}
 ${f("Clan",p.inClan?p.clan:(p.clan?p.clan+" (buiten onze clans)":"Geen clan"))}${p.vorigeClan?f("Vorige clan",`${p.vorigeClan} (tot ${datum(p.overstap)})`):""}${f("TH",p.th)}${f("Helden",p.helden)}${f("Dieren",p.dieren)}${f("Equipment",p.equip)}${f("Bij ons sinds",sindsTekst(p))}${f("Moest doen",c.moest??0)}${f("Gedaan",c.aanv??0)}${f("Niet gedaan",c.gemis??0)}${f("3 sterren",c.drieProcent!=null?Math.round(c.drieProcent)+"%":null)}${f("Laatste oorlog",c.laatste?datum(c.laatste):null)}${f("Rol",p.rol)}${f("Tag",p.tag)}</div></td></tr>`}
function zichtbaar(){const l=D.players.filter(p=>{
 if(zoek&&!p.naam.toLowerCase().includes(zoek))return false;
 if(clanFilter==="uit")return !p.inClan;if(clanFilter&&p.clanTag!==clanFilter)return false;
 if(filter==="laag")return laag(p);if(filter==="gemist")return (p.cw?.gemis||0)>0;return true});
 const e=v=>v==null||v==="";
 return [...l].sort((a,b)=>{const x=waarde(a,sort.k),y=waarde(b,sort.k);if(e(x)&&e(y))return 0;if(e(x))return 1;if(e(y))return -1;return (typeof x==="string"?x.localeCompare(y,"nl"):x-y)*sort.dir})}
function rijen(){return zichtbaar().map(p=>{const d=p.d||{},m=p.cw?.moest??0,mis=p.cw?.gemis??0,i=encodeURIComponent(p.tag),c=p.inClan?clanVan(p.clanTag):null;
 return `<tr><td><div class="speler">${schild(c?.nr,20)}<button class="naam" data-open="${i}" aria-expanded="${open.has(p.tag)}">${esc(p.naam)}</button></div></td>
 <td class="opt">${sindsTekst(p)}</td><td class="n opt">${p.th??"–"}</td><td>${esc(p.league)}${d.l?delta(d.l):""}</td>
 <td class="n opt">${p.helden}${delta(d.h)}</td><td class="n opt">${p.dieren}${delta(d.p)}</td><td class="n opt">${p.equip}${delta(d.e)}</td>
 <td class="n"><span class="tal ${laag(p)?"bad":""}">${m}</span></td><td class="n"><span class="${mis?"tal bad":""}">${mis}</span></td><td class="n ster">${gem(p)!=null?gem(p).toFixed(2):"–"}</td></tr>${open.has(p.tag)?detail(p,COLS.length):""}`}).join("")}
function kop(){return COLS.map(([k,t,n,o,kort])=>`<th class="${n?"n ":""}${o?"opt":""}" aria-sort="${sort.k===k?(sort.dir>0?"ascending":"descending"):"none"}"><button data-k="${k}">${kort?`<span class="lang">${t}</span><span class="kort">${kort}</span>`:t}</button></th>`).join("")}
function spelersView(){return `<section class="sectie"><h2>Alle leden</h2>
 <p class="uitleg">Aanvallen over de laatste ${D.vensterDagen} dagen, in al onze clans samen. Rood bij Moest doen is minder dan ${D.grensAanvallen} aanvallen. ${D.maanden.length<2?"Groei per maand zie je vanaf volgende maand.":"Groen en rood onder een getal is de groei sinds vorige maand."} Bij ons sinds is de eerste bekende maand in een van onze clans. De geschiedenis begint in ${MND[new Date(D.sindsBegin).getUTCMonth()]} ${new Date(D.sindsBegin).getUTCFullYear()}. Tik op een naam voor meer.</p>
 <div class="tools"><input id="zoek" type="search" placeholder="Zoek lid" aria-label="Zoek lid" value="${esc(zoek)}">
 <select id="clanf" aria-label="Filter op clan"><option value="">Alle clans</option>${D.clans.map(c=>`<option value="${esc(c.tag)}"${clanFilter===c.tag?" selected":""}>${esc(c.naam)}</option>`).join("")}<option value="uit"${clanFilter==="uit"?" selected":""}>Buiten onze clans</option></select>
 <select id="filter" aria-label="Filter spelers"><option value="">Alle leden</option><option value="laag"${filter==="laag"?" selected":""}>Onder ${D.grensAanvallen} aanvallen</option><option value="gemist"${filter==="gemist"?" selected":""}>Met gemiste aanvallen</option></select>
 <span class="teller" id="teller"></span></div>
 <div class="tablebox"><table><thead><tr id="kop">${kop()}</tr></thead><tbody id="rijen">${rijen()}</tbody></table></div></section>`}

function opstellingTekst(){const uit=VAKKEN.map(v=>{const c=D.clans.find(x=>x.nr===v.nr),r=[];
 D.players.filter(p=>K(p).plek>=v.van&&K(p).plek<=v.tot).sort((a,b)=>K(a).plek-K(b).plek).forEach(p=>r.push(`${K(p).plek-v.van+1}. ${p.naam}`));
 return r.length?`${c?.naam??"Clan "+v.nr}\n${r.join("\n")}`:null}).filter(Boolean);
 return `🛡️ Opstelling CWL\n\n${uit.join("\n\n")}`}
function keuzeSelect(p,veld,opties){const v=K(p)[veld]||"";if(!bewerk)return v?esc(v):'<span class="weg">–</span>';
 return `<select data-p="${pid(p)}" data-veld="${veld}" aria-label="${veld} ${esc(p.naam)}"><option value=""></option>${opties.map(o=>`<option${o===v?" selected":""}>${o}</option>`).join("")}</select>`}
function slot(n,v,bezet){const p=bezet[n],nr=n-v.van+1;let mid;
 if(bewerk){const opt=q=>`<option value="${pid(q)}"${q===p?" selected":""}>${esc(q.naam)}${K(q).plek!=null&&q!==p?` (${plekNaam(K(q).plek)})`:""}</option>`;
  const vrij=D.players.filter(q=>K(q).plek==null),in_=D.players.filter(q=>K(q).plek!=null);
  mid=`<select data-slot="${n}" aria-label="Clan ${ROMEINS[v.nr]} plek ${nr}"><option value="">Leeg</option><optgroup label="Reserve">${vrij.map(opt).join("")}</optgroup><optgroup label="Ingedeeld">${in_.map(opt).join("")}</optgroup></select>`}
 else mid=p?`<span class="sn">${esc(p.naam)}</span>`:'<span class="weg">Leeg</span>';
 return `<li><span class="nr">${nr}</span>${mid}${!bewerk&&p?`<span class="ster">${gem(p)!=null?gem(p).toFixed(2):""}</span>`:""}</li>`}
function letOp(){const ing=D.players.filter(p=>K(p).plek!=null),m=[],n=l=>l.map(p=>esc(p.naam)).join(", ");
 const a=ing.filter(p=>K(p).appgroep==="Nee");if(a.length)m.push(`Ingedeeld maar niet in de appgroep: ${n(a)}`);
 const b=ing.filter(p=>K(p).keuze==="Nee");if(b.length)m.push(`Ingedeeld met keuze Nee: ${n(b)}`);
 const c=ing.filter(laag);if(c.length)m.push(`Ingedeeld met te weinig aanvallen: ${n(c)}`);
 return m.length?`<div class="letop"><h3>Let op</h3><ul>${m.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
function keuzeRijen(){const z=oorlogZoek;return D.players.filter(p=>!z||p.naam.toLowerCase().includes(z)).sort((a,b)=>(K(a).plek??1e9)-(K(b).plek??1e9)||a.naam.localeCompare(b.naam,"nl")).map(p=>`<tr><td><div class="speler">${schild(p.inClan?clanVan(p.clanTag)?.nr:0,20)}<span class="sn">${esc(p.naam)}</span></div></td><td>${keuzeSelect(p,"appgroep",["Ja","Nee"])}</td><td>${keuzeSelect(p,"aanmelding",["Ja","Nee"])}</td><td>${keuzeSelect(p,"keuze",KEUZES)}</td><td class="opt">${esc(plekNaam(K(p).plek))||'<span class="weg">Reserve</span>'}</td></tr>`).join("")}
function opstellingView(){const bezet={};D.players.forEach(p=>{if(K(p).plek!=null)bezet[K(p).plek]=p});
 const res=D.players.filter(p=>K(p).plek==null);
 const knoppen=bewerk?`<button class="knop" data-actie="opslaan"${gewijzigd?"":" disabled"}>Wijzigingen opslaan${gewijzigd?` (${gewijzigd})`:""}</button><button class="knop licht" data-actie="stop">Stop met bewerken</button><button class="knop licht" data-actie="vergeet">Sleutel vergeten</button>`:`<button class="knop" data-kopieer="opsttekst">Kopieer voor de appgroep</button><button class="knop licht" data-actie="bewerk">Opstelling bewerken</button>`;
 return `<section class="sectie"><h2>Opstelling CWL</h2><div class="tools">${knoppen}<span class="teller" id="opslagmelding" role="status">${esc(opslagMelding)}</span></div>
 <div id="sleutelform" hidden class="sleutel"><label for="sleutel">GitHub-sleutel met schrijfrecht op de clan-repository</label><div class="tools"><input id="sleutel" type="password" autocomplete="off"><button class="knop" data-actie="sleutel">Start met bewerken</button></div><p class="uitleg">De sleutel blijft in deze browser en gaat alleen naar GitHub.</p></div>
 <textarea id="opsttekst" hidden readonly>${esc(opstellingTekst())}</textarea>${letOp()}
 <div class="vakken">${VAKKEN.map(v=>{const c=D.clans.find(x=>x.nr===v.nr);const t=v.tot;let r="";for(let n=v.van;n<=t;n++)r+=slot(n,v,bezet);
  return `<article class="vak"><div class="vakkop">${schild(v.nr,32)}<h3>${esc(c?.naam??"Clan "+v.nr)}</h3></div><ol>${r}</ol></article>`}).join("")}</div>
 <details class="reserve"><summary>Reserve (${res.length} spelers)</summary><p>${res.map(p=>esc(p.naam)).join(", ")}</p></details></section>
 <section class="sectie"><h2>Keuzes per speler</h2><div class="tools"><input id="kzoek" type="search" placeholder="Zoek speler" aria-label="Zoek speler" value="${esc(oorlogZoek)}"></div>
 <div class="tablebox"><table><thead><tr><th><span class="kp">Speler</span></th><th><span class="kp">Appgroep</span></th><th><span class="kp">Aanmelding</span></th><th><span class="kp">Keuze</span></th><th class="opt"><span class="kp">Plek</span></th></tr></thead><tbody id="krijen">${keuzeRijen()}</tbody></table></div></section>`}
function zetKeuze(id,veld,w){const r={...(L.spelers[id]||{})};if(w===""||w==null)delete r[veld];else r[veld]=w;if(Object.keys(r).length)L.spelers[id]=r;else delete L.spelers[id];gewijzigd++}
const sleutelLees=()=>{try{return localStorage.getItem("eoe-sleutel")}catch{return null}};
const sleutelZet=v=>{try{v?localStorage.setItem("eoe-sleutel",v):localStorage.removeItem("eoe-sleutel")}catch{}};
const b64=t=>{let x="";new TextEncoder().encode(t).forEach(c=>x+=String.fromCharCode(c));return btoa(x)};
const tekstVan=b=>new TextDecoder().decode(Uint8Array.from(atob(b.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const ghFout=s=>s===401?"De sleutel is ongeldig of verlopen. Vul een nieuwe sleutel in.":s===403||s===404?"Deze sleutel mag niet schrijven in de repository. Geef hem Contents: Read and write.":s===409||s===422?"Iemand anders heeft de opstelling net gewijzigd. Vernieuw de pagina en probeer het opnieuw.":"Opslaan is niet gelukt. Controleer je verbinding en probeer het opnieuw.";
async function gh(opties={}){const r=await fetch(LEIDING_URL+(opties.method?"":"?ref=main"),{...opties,cache:"no-store",headers:{Authorization:"Bearer "+sleutelLees(),Accept:"application/vnd.github+json"}});if(!r.ok){const e=new Error("gh");e.status=r.status;throw e}return r.json()}
async function startBewerken(){opslagMelding="Laden…";render();try{const f=await gh();sha=f.sha;L=JSON.parse(tekstVan(f.content));bewerk=true;gewijzigd=0;opslagMelding=""}catch(e){opslagMelding=ghFout(e.status);if(e.status===401)sleutelZet(null)}render()}
async function opslaan(){opslagMelding="Opslaan…";render();try{const tekst=JSON.stringify(L,null,1)+"\n",r=await gh({method:"PUT",body:JSON.stringify({message:"Opstelling bijwerken",content:b64(tekst),sha,branch:"main"})});sha=r.content.sha;gewijzigd=0;opslagMelding="Opgeslagen. Voor anderen zichtbaar binnen enkele minuten."}catch(e){opslagMelding=ghFout(e.status)}render()}

function oorlogenView(){const w=D.oorlogen.filter(x=>(x.status==="warEnded"||x.status==="onvolledig")&&(!oorlogClan||x.clan.tag===oorlogClan)).sort((a,b)=>(b.einde||"").localeCompare(a.einde||""));
 const keuze=`<div class="tools"><select id="oorlogclan" aria-label="Filter op clan"><option value="">Alle clans</option>${[...D.clans].sort((a,b)=>(a.nr||0)-(b.nr||0)).map(c=>`<option value="${esc(c.tag)}"${oorlogClan===c.tag?" selected":""}>${esc(c.naam)}</option>`).join("")}</select><span class="teller">${w.length} oorlogen</span></div>`;
 if(!w.length)return `<section class="sectie"><h2>Uitslagen</h2>${keuze}<p class="uitleg">Geen afgelopen oorlogen gevonden. Lopende oorlogen staan op de statuspagina.</p></section>`;
 return `<section class="sectie"><h2>Uitslagen</h2>${keuze}<div class="lijst">${w.map(x=>{const c=clanVan(x.clan.tag),a=x.clan.stars??0,b=x.tegenstander.stars??0,heel=x.status==="warEnded",o=heel?oordeel(x):null,kl=o?.[0]==="win"?"win":o?.[0]==="ver"?"ver":"";
  return `<article class="uitslag">${schild(c?.nr,32)}<div class="wie"><b>tegen ${esc(x.tegenstander.name)}</b><span>${x.soort==="cwl"?`CWL ronde ${x.ronde??"?"}`:"Clanoorlog"}, ${datum(iso(x.start))}</span></div>
  <div class="sc ${kl}">${a} – ${b}<small>${o?o[1]:"Einde niet gezien"}, ${x.gebruikt}/${x.totaal}</small></div></article>`}).join("")}</div></section>`}

function berichten(){const uit=[];
 D.oorlogen.filter(w=>w.status==="inWar").forEach(w=>{const namen=w.open.map(o=>`- ${o.naam}${o.over>1?` (${o.over} over)`:""}`).join("\n");
  uit.push([`Herinnering ${w.clan.name}`,`⚔️ ${w.clan.name} tegen ${w.tegenstander.name}\nStand: ${w.clan.stars} - ${w.tegenstander.stars}\nDe oorlog eindigt ${klok(tijd(w.einde))}.\n\n${namen?"Nog aanvallen:\n"+namen:"Iedereen heeft aangevallen. Top!"}`])});
 const w=D.oorlogen.find(x=>x.status==="warEnded");
 if(w){const t={win:"Gewonnen! 🎉",ver:"Verloren.",open:"Gelijkspel."}[oordeel(w)[0]];
  uit.push([`Laatste uitslag ${w.clan.name}`,`🏁 ${w.clan.name} tegen ${w.tegenstander.name}\n${t}\nSterren: ${w.clan.stars} - ${w.tegenstander.stars}\nAanvallen gebruikt: ${w.gebruikt}/${w.totaal}${w.open.length?"\n\nNiet alles gebruikt:\n"+w.open.map(o=>`- ${o.naam}`).join("\n"):""}`])}
 const top=D.players.filter(p=>p.inClan&&p.d&&(p.d.h||p.d.p||p.d.e)).map(p=>[p,p.d.h+p.d.p+p.d.e]).sort((a,b)=>b[1]-a[1]).slice(0,5);
 if(top.length)uit.push(["Groeiers van de maand",`📈 Grootste groei deze maand\n${top.map(([p,g],i)=>`${i+1}. ${p.naam} (+${g})`).join("\n")}`]);
 return uit}
function berichtenView(){const b=berichten();
 return `<section class="sectie"><h2>Berichten voor de appgroep</h2>${b.length?`<div class="berichten">${b.map(([t,x],i)=>`<article class="bericht"><h3>${esc(t)}</h3><textarea id="b${i}" rows="${Math.min(x.split("\n").length+1,16)}" readonly aria-label="${esc(t)}">${esc(x)}</textarea><button class="knop" data-kopieer="b${i}">Kopieer bericht</button></article>`).join("")}</div>`:'<p class="uitleg">Er zijn nu geen berichten om te delen.</p>'}</section>`}

function nav(){$("nav").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}"${tab===k?' aria-current="page"':""}>${t}</button>`).join("")}
function merk(){const c=D.clans.find(x=>x.nr===1);if(!c)return;$("merknaam").textContent=c.naam;if(c.logo)$("merklogo").outerHTML=`<img id="merklogo" class="logo" src="${esc(c.logo)}" width="44" height="44" alt="">`}
function render(){merk();nav();$("muur").innerHTML=tab==="overzicht"?muur():"";document.querySelector(".wall").classList.toggle("laag",tab!=="overzicht");$("voet").textContent=`Bijgewerkt ${klok(new Date(D.bijgewerkt))}. `;$("inhoud").innerHTML={overzicht:overzichtView,spelers:spelersView,opstelling:opstellingView,oorlogen:oorlogenView,berichten:berichtenView}[tab]();if(tab==="spelers")teller()}
function teller(){$("teller").textContent=`${zichtbaar().length} leden`}
function tabel(){$("rijen").innerHTML=rijen();$("kop").innerHTML=kop();teller()}

addEventListener("click",async e=>{const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;history.replaceState(null,"","#"+tab);render();return}
 const rd=e.target.closest("[data-ronde]");if(rd){const f=document.querySelector(".front")?.scrollLeft;rondeKeuze[rd.dataset.kclan]=+rd.dataset.ronde;render();document.querySelector(".front").scrollLeft=f;return}
 const k=e.target.closest("[data-k]");if(k){const c=k.dataset.k;if(sort.k===c)sort.dir*=-1;else sort={k:c,dir:c==="naam"?1:-1};tabel();return}
 const o=e.target.closest("[data-open]");if(o){const i=decodeURIComponent(o.dataset.open);open.has(i)?open.delete(i):open.add(i);tabel();return}
 const b=e.target.closest("[data-actie]");if(b){const a=b.dataset.actie;
  if(a==="bewerk"){if(sleutelLees())startBewerken();else{$("sleutelform").hidden=false;$("sleutel").focus()}}
  if(a==="sleutel"){const w=$("sleutel").value.trim();if(w){sleutelZet(w);startBewerken()}}
  if(a==="stop"){if(!gewijzigd||confirm("Niet-opgeslagen wijzigingen weggooien?")){bewerk=false;gewijzigd=0;opslagMelding="";await laadLeiding();render()}}
  if(a==="vergeet"){sleutelZet(null);bewerk=false;gewijzigd=0;opslagMelding="Sleutel verwijderd uit deze browser.";await laadLeiding();render()}
  if(a==="opslaan")opslaan();return}
 const c=e.target.closest("[data-kopieer]");if(c){const oud=c.textContent;const v=$(c.dataset.kopieer);try{await navigator.clipboard.writeText(v.value);c.textContent="Gekopieerd"}catch{v.select();c.textContent="Selecteer de tekst en kopieer zelf"}setTimeout(()=>c.textContent=oud,2200)}});
setInterval(ververs,3e4);
document.addEventListener("visibilitychange",ververs);
addEventListener("toggle",e=>{const d=e.target;if(d.dataset?.lijst){d.open?dichteLijst.delete(d.dataset.lijst):dichteLijst.add(d.dataset.lijst)}},true);
setInterval(()=>document.querySelectorAll("[data-tot]").forEach(x=>{x.textContent=resttijd(+x.dataset.tot)}),1e3);
addEventListener("input",e=>{if(e.target.id==="zoek"){zoek=e.target.value.trim().toLowerCase();tabel()}if(e.target.id==="kzoek"){oorlogZoek=e.target.value.trim().toLowerCase();$("krijen").innerHTML=keuzeRijen()}});
addEventListener("beforeunload",e=>{if(gewijzigd)e.preventDefault()});
addEventListener("change",e=>{if(e.target.id==="filter"){filter=e.target.value;tabel()}if(e.target.id==="clanf"){clanFilter=e.target.value;tabel()}if(e.target.id==="oorlogclan"){oorlogClan=e.target.value;render()}
 const t=e.target;if(t.dataset.veld){zetKeuze(t.dataset.p,t.dataset.veld,t.value);render()}
 if(t.dataset.slot){const n=+t.dataset.slot,nieuw=t.value,oud=D.players.find(p=>K(p).plek===n);if(oud&&pid(oud)===nieuw)return;
  const herkomst=nieuw?(L.spelers[nieuw]?.plek??null):null;if(oud)zetKeuze(pid(oud),"plek",herkomst);if(nieuw)zetKeuze(nieuw,"plek",n);render()}});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(D&&TABS.some(x=>x[0]===h)&&h!==tab){tab=h;render()}});

async function laadLeiding(){try{const r=await fetch("data/leiding.json",{cache:"no-store"});if(r.ok)L=await r.json()}catch{}}
(async()=>{const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h))tab=h;nav();
 try{const r=await fetch("data/latest.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);D=await r.json();await laadLeiding();render();try{const l=await fetch("data/live.json",{cache:"no-store"});if(l.ok)liveUrl=(await l.json()).url?.replace(/\/$/,"")||null;ververs()}catch{}
  if((Date.now()-new Date(D.bijgewerkt))/36e5>12)$("inhoud").insertAdjacentHTML("afterbegin",'<p class="melding" style="margin-bottom:18px">Deze gegevens zijn ouder dan 12 uur. Controleer de workflow in GitHub Actions.</p>')}
 catch{$("inhoud").innerHTML='<p class="melding">De clandata kon niet worden geladen. Vernieuw de pagina om het opnieuw te proberen.</p>'}})();
</script>
</body>
</html>
