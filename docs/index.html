<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eye on Eye Clan</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self' https://api.github.com https://*.workers.dev; img-src data: https://api-assets.clashofclans.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#12337A">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/rubik-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:500;src:url(fonts/rubik-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:700;src:url(fonts/rubik-latin-700-normal.woff2) format("woff2");font-display:swap}

:root{
 --night:#12337A;--night-deep:#0C2559;--gold:#F2B632;--on-night:#FFFFFF;--on-night-soft:#C4D2EE;
 --page:#E8EDF5;--surface:#FFFFFF;--ink:#14203A;--muted:#55607A;--line:#D3DAE6;--star:#946100;
 --good:#17804A;--bad:#C2332B;
 --c1:#F2B632;--c1t:#3A2800;--c2:#2F7DE1;--c2t:#FFFFFF;--c3:#CF3F35;--c3t:#FFFFFF;--c4:#238A5C;--c4t:#FFFFFF;
 --display:"Lilita One","Arial Black",Arial,sans-serif;--body:Rubik,"Segoe UI",Arial,sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --night:#17408F;--night-deep:#102F70;--page:#0E1830;--surface:#172444;--ink:#EAF0FB;--muted:#A6B3CE;--line:#2C3B63;--star:#F2B632;
 --good:#62CF95;--bad:#FF9A92;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:3px}
.inner{max-width:1280px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left))}

/* De muur: blauwe kop met kantelen als enige blikvanger. */
.wall{position:relative;background:var(--night);color:var(--on-night);padding-bottom:44px}
.wall.laag{padding-bottom:30px}
.wall::after{content:"";position:absolute;inset:auto 0 0;height:22px;background:repeating-linear-gradient(90deg,var(--page) 0 30px,transparent 30px 66px)}
.top{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;letter-spacing:.01em}
.nav{display:flex;gap:4px}
.nav button{all:unset;cursor:pointer;font:400 18px/1 var(--display);padding:10px 14px;border-radius:6px;color:var(--on-night-soft)}
.nav button[aria-current="page"]{background:var(--gold);color:#2B1E00}
.nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.fresh{font-size:14px;color:var(--on-night-soft);margin:0}
.warhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;margin:14px 0 6px}
.warhead h2{font-size:34px}

.logo{display:block;object-fit:contain;flex:none}
.front{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch}
.kol{display:flex;flex-direction:column;gap:10px;background:var(--night-deep);border-radius:8px;padding:14px;min-width:0}
.kolkop{display:flex;align-items:center;gap:10px;min-height:60px}
.kolkop h3{font-size:22px}
.kolkop p{margin:2px 0 0;font-size:13px;line-height:1.25;color:var(--on-night-soft)}
.tegen{display:flex;align-items:center;gap:8px;min-height:40px;font-size:14px;border-top:1px solid rgb(255 255 255/.16);padding-top:10px}
.tegen b{display:block;font-weight:500;overflow-wrap:anywhere;line-height:1.2}
.tegen span{display:block;font-size:13px;color:var(--on-night-soft)}
.rondes{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.rondes button{all:unset;box-sizing:border-box;text-align:center;font:400 16px/30px var(--display);height:32px;border-radius:4px;background:rgb(255 255 255/.08);color:var(--on-night-soft);cursor:pointer}
.rondes button[disabled]{cursor:default;opacity:.55}
.rondes .bezig{background:#2F7DE1;color:#fff}
.rondes .voor{background:#E58A1F;color:#2B1400}
.rondes .win{background:#17804A;color:#fff}
.rondes .ver{background:#C2332B;color:#fff}
.rondes .open{background:#6B7488;color:#fff}
.rondes button[aria-current]{box-shadow:0 0 0 2px var(--night-deep),0 0 0 4px #fff}
.rondes button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 10px;align-items:center;text-align:center;font-size:15px}
.score .lab{font-size:12px;color:var(--on-night-soft)}
.pil{font:400 30px/1.2 var(--display);border-radius:5px;padding:2px 0}
.pil.wij{background:#2F7DE1;color:#fff}
.pil.zij{background:#C2332B;color:#fff}
.met{display:grid;gap:3px}
.balk{display:block;height:7px;border-radius:2px;background:rgb(255 255 255/.14);overflow:hidden}
.balk i{display:block;height:100%;background:#4C93EE}
.balk.zij i{background:#E5574C}
.timer{display:grid;gap:1px;text-align:center;font-size:13px;color:var(--on-night-soft);background:rgb(255 255 255/.07);border-radius:6px;padding:7px 8px}
.timer b{font:400 22px/1.15 var(--display);color:var(--on-night)}
.leden{list-style:none;margin:6px 0 0;padding:0}
.leden li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:7px;align-items:center;padding:4px 0;border-top:1px solid rgb(255 255 255/.1);color:var(--on-night)}
.rang{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:rgb(255 255 255/.14)}
.rang.ja{background:#17804A;color:#fff}
.rang.nee{background:#C2332B;color:#fff}
.ats{display:grid;gap:1px}
.aanval{display:grid;grid-template-columns:62px 32px;align-items:center;gap:3px}
.aanval small{font-size:12px;color:var(--on-night-soft);text-align:right}
.st{font-size:20px;letter-spacing:0;line-height:1.1}
.st.s3{color:#6FE0A6}.st.s2{color:var(--gold)}.st.s1{color:#FF9A4D}.st.leeg{color:rgb(255 255 255/.32)}
.oordeel{margin:0;padding:7px 10px;border-radius:6px;font-weight:700;text-align:center;font-size:15px}
.oordeel.win{background:var(--gold);color:#2B1E00}
.oordeel.ver{background:#C2332B;color:#fff}
.oordeel.open{background:rgb(255 255 255/.12);color:var(--on-night)}
.klok{margin:0;font-size:14px;color:var(--on-night-soft)}
details.open{font-size:14px}
details.open summary{cursor:pointer;font-weight:500;color:var(--on-night);padding-block:3px}
.rust{margin:0;color:var(--on-night-soft)}

main{display:block;padding-block:22px 40px}
main:empty{padding-block:6px}
.sectie{display:grid;gap:14px;min-width:0}
.sectie+.sectie{margin-top:30px}
.sectie>h2{font-size:26px}

/* Clans: rijen met schild, geen losse kaartjes. */
.clans{background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.clan{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:grid;grid-template-columns:52px minmax(0,1.3fr) repeat(3,minmax(84px,1fr));gap:4px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.clan:first-child{border-top:0}
.clan .kop{display:block}.cn{display:block;font:400 21px/1.1 var(--display)}
.clan .rol{display:block;color:var(--muted);font-size:14px}
.clan:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.feit{display:block;font-size:14px;color:var(--muted)}
.feit b{display:block;font:500 17px/1.2 var(--body);color:var(--ink)}
.feit b.ster{color:var(--star)}
.waarschuwing{margin:0;color:#FFB4AD;font-size:13px}
.shield{display:block}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#zoek{flex:1 1 180px;max-width:300px}
.teller{color:var(--muted);font-size:14px}
.uitleg{margin:0;color:var(--muted);font-size:14px;max-width:72ch}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 13px/1.2 var(--body);text-align:left;color:var(--muted);border-bottom:2px solid var(--line);padding:0;white-space:nowrap}
th button{all:unset;cursor:pointer;display:block;padding:10px 8px}
th.n,td.n{text-align:right}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.speler{display:flex;align-items:center;gap:8px;min-width:0}
.naam{all:unset;cursor:pointer;font-weight:500;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.naam:focus-visible{outline:3px solid var(--gold)}
.d{display:block;font-size:12px;line-height:1.1;color:var(--muted)}
.d.up{color:var(--good)}.d.down{color:var(--bad)}
.kort{display:none}
.tal{font-weight:700}
.tal.bad{color:var(--bad)}
.ster{color:var(--star);font-weight:500}
.weg{color:var(--muted);font-size:13px}
.detail td{white-space:normal;background:color-mix(in srgb,var(--night) 6%,var(--surface))}
.dgrid{display:flex;flex-wrap:wrap;gap:12px 28px;padding:6px 0}
.spark{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.spark svg{display:block;width:140px;height:38px;color:var(--c2)}
.spark polyline{fill:none;stroke:currentColor;stroke-width:1.8}
.spark circle{fill:currentColor}
.spark b{color:var(--ink);font-weight:500}

.lijst{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.uitslag{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.uitslag:first-child{border-top:0}
.uitslag .wie b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uitslag .wie span{display:block;color:var(--muted);font-size:14px}
.uitslag .sc{font:400 24px/1 var(--display);text-align:right}
.uitslag .sc.win{color:var(--good)}.uitslag .sc.ver{color:var(--bad)}
.uitslag .sc small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}

.berichten{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.bericht{display:grid;gap:8px;min-width:0}
.bericht h3{font-size:20px}
textarea{width:100%;resize:vertical;font:inherit;font-size:15px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.knop{all:unset;cursor:pointer;justify-self:start;font-weight:500;background:var(--night);color:#fff;border-radius:6px;padding:9px 14px}
.knop:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.kort,.kp{font:inherit}
th .kp{display:block;padding:10px 8px}
.vakken{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:start}
.vak{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.vakkop{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.vakknoppen{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.vakkop .klein{padding:4px 10px;font-size:13px}
.vak h3{font-size:21px}
.vak ol{list-style:none;margin:0;padding:0}
.vak li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:36px;border-top:1px solid var(--line)}
.vak li select{width:100%}
.vak .nr{font:400 16px/1 var(--display);color:var(--muted);text-align:right}
.sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:0}
.letop{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:6px;padding:10px 14px}
.letop h3{font-size:18px}.letop ul{margin:6px 0 0;padding-left:18px;font-size:15px}
.reserve summary{cursor:pointer;font-weight:500}.reserve p{margin:6px 0 0;color:var(--muted);max-width:90ch}
.sleutel[hidden]{display:none}
.sleutel{display:grid;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.sleutel input{flex:1 1 220px;max-width:420px}
.knop.licht{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.knop[disabled]{opacity:.5;cursor:default}
.cwlgroep{display:grid;gap:8px;min-width:0}
.cwlstand tr.wij td{background:color-mix(in srgb,#2F7DE1 13%,var(--surface));font-weight:500}
.rs{display:inline-grid;min-width:32px;text-align:center;border-radius:4px;padding:2px 3px;background:color-mix(in srgb,var(--muted) 18%,transparent)}
.rs b{font-weight:500;font-size:15px;line-height:1.1}.rs small{font-size:11px;line-height:1.1;opacity:.85}
.rs.w{background:#17804A;color:#fff}.rs.g{background:#6B7488;color:#fff}.rs.v{background:#C2332B;color:#fff}.rs.bezig{background:#2F7DE1;color:#fff}
.plek{white-space:nowrap}.pijl{display:inline-block;width:14px;color:var(--muted)}
.cwlstand tr.op .pijl{color:var(--good)}.cwlstand tr.neer .pijl{color:var(--bad)}
.cwlstand tr.op td:first-child{box-shadow:inset 4px 0 0 var(--good)}.cwlstand tr.neer td:first-child{box-shadow:inset 4px 0 0 var(--bad)}
.vooruit{margin:0;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px}
.vooruit b{font-weight:700}.vooruit b.ja,.vz.ja{color:var(--good)}.vooruit b.nee,.vz.nee{color:var(--bad)}
.vz{font-size:13px;font-weight:500}
.melding{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:6px;padding:10px 14px;margin:0}
footer{padding-block:0 28px;color:var(--muted);font-size:13px}

@media (max-width:1040px){
 .front{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding-inline:16px;scroll-padding-inline:16px;padding-bottom:6px}
 .kol{flex:0 0 min(320px,88%);scroll-snap-align:start}
}
@media (max-width:720px){
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
 .nav{position:fixed;z-index:5;inset:auto 0 0;background:var(--night-deep);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .nav{gap:2px}
 .nav button{flex:1;text-align:center;font-size:14.5px;padding:12px 1px}
 .wall{padding-bottom:40px}
 .wall.laag{padding-bottom:26px}
 .warhead h2{font-size:28px}
 .clan{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px 10px}
 .clan .kop{grid-column:2/-1}
 .clan .feit:nth-of-type(1){grid-column:2}
 .opt{display:none}
 .naam{max-width:72px}
 table{font-size:14px}
 .plat table{font-size:13px}
 .plat td{padding-inline:3px}
 td,th button{padding-inline:5px}
 .kort{display:inline}.lang{display:none}
 .cwlstand .sn{max-width:118px}
 td:first-child,th:first-child button{padding-left:8px}
 td:last-child,th:last-child button{padding-right:8px}
}
@media (max-width:380px){.naam{max-width:86px}}
@media (prefers-reduced-motion:no-preference){
 .tug i{transition:width .5s ease}
}

/* Game-skin: stevige panelen, goud op nachtblauw, knoppen met diepte. */
:root{--night:#17408F;--night-deep:#0E2A66;--page:#0A1A42;--surface:#17336F;--ink:#F4F7FF;--muted:#AFBEDF;--line:#2E4F99;--star:#FFC93C;--gold:#FFC93C;--on-night:#FFFFFF;--on-night-soft:#C4D2EE;--good:#62DE93;--bad:#FF8F84;color-scheme:dark}
body{background:linear-gradient(180deg,#0E2560,#0A1A42 420px) var(--page)}
.wall{background:linear-gradient(180deg,#1F54B8,#17408F 240px)}
.wall::after{background:repeating-linear-gradient(90deg,#0E2560 0 30px,transparent 30px 66px)}
h1,h2,h3{text-shadow:0 2px 0 rgb(0 0 0/.45)}
.brand h1{font-size:32px}
.kol,.clans,.vak,.tablebox,.lijst,.letop,.sleutel,.paneel{background:linear-gradient(180deg,#21438F,#17336F 90px);border:2px solid #081538;border-radius:12px;box-shadow:inset 0 2px 0 rgb(255 255 255/.14),0 4px 0 #071230}
.kol{background:linear-gradient(180deg,#143479,#0E2A66 110px)}
.tablebox.plat{background:none;border:0;box-shadow:none;border-radius:0}
.paneel{padding:14px 16px;display:grid;gap:10px;min-width:0;align-content:start}
.plat th .kp,.plat td{padding-inline:5px}
.plat table{font-size:14px}
.paneel h3{font-size:21px}
th{color:#CFDcf8;background:#0F2A66}th:first-child{border-top-left-radius:9px}th:last-child{border-top-right-radius:9px}
.tablebox.plat th{background:rgb(0 0 0/.22)}
tbody tr:hover td{background:rgb(255 255 255/.05)}
.naam{color:#fff}.naam:hover{color:var(--gold);text-decoration:underline}
a.knop{text-decoration:none;display:inline-block}
.knop{background:linear-gradient(180deg,#FFD65A,#F2A71B);color:#3A2600;font-weight:700;border-radius:9px;padding:9px 16px;box-shadow:inset 0 2px 0 rgb(255 255 255/.5),0 3px 0 #9A6400}
.knop.licht{background:linear-gradient(180deg,#3F78DE,#2558B8);color:#fff;box-shadow:inset 0 2px 0 rgb(255 255 255/.28),0 3px 0 #123676}
.knop:active{transform:translateY(2px);box-shadow:0 1px 0 #123676}
.knop[disabled]{filter:grayscale(.7)}
.nav button{border-radius:9px;background:linear-gradient(180deg,#2C5FC0,#1C4596);color:#fff;box-shadow:inset 0 2px 0 rgb(255 255 255/.2),0 3px 0 #0C2A66}
.nav button[aria-current="page"]{background:linear-gradient(180deg,#FFD65A,#F2A71B);color:#3A2600;box-shadow:inset 0 2px 0 rgb(255 255 255/.5),0 3px 0 #9A6400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:5px 12px;border-radius:999px;font-weight:500;font-size:14px;background:#17336F;border:2px solid #2E4F99;color:#fff}
.chip[aria-pressed="true"]{background:var(--gold);border-color:#9A6400;color:#3A2600}
.chip:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tegels{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:8px}
.tegel{display:grid;gap:1px;padding:9px 10px;border-radius:9px;background:rgb(0 0 0/.24);box-shadow:inset 0 1px 0 rgb(255 255 255/.08);text-align:center;font-size:13px;color:var(--muted)}
.tegel b{font:400 26px/1.1 var(--display);color:#fff;text-shadow:0 2px 0 rgb(0 0 0/.4)}
.tegel.t-win b{color:var(--good)}.tegel.t-ver b{color:var(--bad)}.tegel.t-goud b{color:var(--gold)}.tegel.t-g b{color:#C8D1E4}
.tegels.klein .tegel b{font-size:22px}
.uitslag{border-left:6px solid #6B7488}.uitslag.r-win{border-left-color:#17A25A}.uitslag.r-ver{border-left-color:#D2392E}
.profielkop{display:flex;align-items:center;gap:16px}
.pk{display:grid;gap:6px;min-width:0}.pk h2{font-size:34px}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.label{padding:3px 9px;border-radius:6px;background:rgb(0 0 0/.28);font-size:13px;font-weight:500}
.label.goud{background:var(--gold);color:#3A2600;font-weight:700}
.terug{justify-self:start}
.profiel{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.lvls{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.lvls li{display:grid;grid-template-columns:minmax(0,1.1fr) 1fr 62px;gap:8px;align-items:center;font-size:14px}
.lvls b{text-align:right;font-weight:500}
.lvlbar{display:block;height:11px;border-radius:6px;background:rgb(0 0 0/.35);overflow:hidden}

<script>

const ROMEINS=["","I","II","III","IV"];

const clanVan=t=>D.clans.find(c=>c.tag===t);

 return `<svg class="shield" width="${maat}" height="${maat*1.15}" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/></svg>`}

const COLS=[["naam","Speler"],["sinds","Lid sinds",0,1],["th","TH",1,1],["lgn","League"],["helden","Helden",1,1],["dieren","Dieren",1,1],["equip","Equipment",1,1],["spreuken","Spreuken",1,1],["troepen","Troepen",1,1],["moest","Aanvallen",1,0,"Aanv."],["gedaan","Aanvallen gedaan",1,1],["gemis","Aanvallen gemist",1,0,"Gemist"],["gem","Gem ★",1],["eis","Eisen",0,1]];

const soortNaam=w=>w.soort==="cwl"?`CWL ronde ${w.ronde??"?"}`:"Clanoorlog";
function oordeel(w){const a=w.clan.stars||0,b=w.tegenstander.stars||0;
 if(w.status==="warEnded"){const x=w.clan.destructionPercentage,y=w.tegenstander.destructionPercentage;if(a>b||(a===b&&x>y))return ["win","Gewonnen"];if(a<b||(a===b&&x<y))return ["ver","Verloren"];return ["open","Gelijkspel"]}

 if(a>w.maxZij)return ["win","Winst is binnen"];
 if(w.maxOns<b)return ["ver","Niet meer te winnen"];
 return ["open","Nog niet beslist"]}
const pct=v=>v==null?"–":`${(+v).toFixed(2).replace(".",",")}%`;
const mmss=v=>v==null?"–":`${Math.floor(v/60)}m ${String(v%60).padStart(2,"0")}s`;
function resttijd(doel){const t=Math.max(0,Math.floor((doel-Date.now())/1e3));return `${Math.floor(t/3600)}u ${String(Math.floor(t/60)%60).padStart(2,"0")}m ${String(t%60).padStart(2,"0")}s`}
function scoreBlok(w){const o=oordeel(w),per=w.totaal||0,ons=w.clan.aanvallen??w.gebruikt,zij=w.tegenstander.aanvallen??0,rij=(l,a,b)=>`<span>${a}</span><span class="lab">${l}</span><span>${b}</span>`;
 const balk=(v,k)=>`<i class="balk ${k}" role="img" aria-label="${v} van ${per}"><i style="width:${per?100*v/per:0}%"></i></i>`;
 return `<div class="score"><b class="pil wij">${w.clan.stars??0}</b><span class="lab">Sterren</span><b class="pil zij">${w.tegenstander.stars??0}</b>
 ${rij("Vernietigd",pct(w.clan.destructionPercentage),pct(w.tegenstander.destructionPercentage))}${rij("Gem. tijd",mmss(w.gemTijdOns),mmss(w.gemTijdZij))}
 <span class="met">${balk(ons,"wij")}${ons}/${per}</span><span class="lab">Aanvallen</span><span class="met">${balk(zij,"zij")}${zij}/${per}</span>

function timerBlok(w){const e=tijd(w.einde),st=tijd(w.start);
 if(w.status==="inWar")return `<div class="timer"><b data-tot="${+e}">${resttijd(e)}</b><span>Eindigt ${klok(e)}</span></div>`;

 return `<div class="timer"><span>Afgelopen ${klok(e)}</span></div>`}
function sterRij(a){const n=a?.sterren??0,k=!a?"leeg":n===3?"s3":n===2?"s2":n===1?"s1":"leeg";return `<span class="aanval"><span class="st ${k}" role="img" aria-label="${a?`${n} sterren, ${a.procent}%`:"Nog niet aangevallen"}">${"★".repeat(n)}${"☆".repeat(3-n)}</span><small>${a?`${a.procent}%`:""}</small></span>`}
function ledenLijst(c,w){const per=w.perLid||1,leden=w.leden||[],nog=leden.filter(m=>m.aanvallen.length<per).length;
 const tekst=w.status==="inWar"?(nog?`${nog} van ${leden.length} moeten nog aanvallen`:"Iedereen heeft aangevallen"):w.status==="preparation"?`Opstelling (${leden.length} spelers)`:"Aanvallen per speler";
 return `<details class="open" data-lijst="${esc(c.tag)}"${dichteLijst.has(c.tag)?"":" open"}><summary>${tekst}</summary><ol class="leden">${leden.map((m,i)=>{const klaar=m.aanvallen.length>=per,rijen=[];for(let j=0;j<per;j++)rijen.push(sterRij(m.aanvallen[j]));

function rondeKnoppen(c,rondes,keuze){let r="";for(let i=1;i<=7;i++){const w=rondes[i],o=w&&w.status==="warEnded"?oordeel(w)[0]:"",k=!w?"":w.status==="inWar"?"bezig":w.status==="preparation"?"voor":o;

function maxSterren(sterren,over,aanvallen,grootte){const b={};aanvallen.forEach(a=>b[a.doel]=Math.max(b[a.doel]||0,a.sterren));

 return sterren+rest.slice(0,over).reduce((x,y)=>x+y,0)}

 const leden=[...(ons.members||[])].sort((a,b)=>(a.mapPosition||99)-(b.mapPosition||99)),mijn=leden.flatMap(m=>m.attacks||[]),hun=(zij.members||[]).flatMap(m=>m.attacks||[]);

function poolStats(lijst){const[m1,m2]=cwlMaanden(),velden={th:p=>p.th,lgn:p=>p.lgn||null,helden:p=>p.helden,dieren:p=>p.dieren,equip:p=>p.equip,spreuken:p=>p.spreuken??null,troepen:p=>p.troepen??null,aanv:p=>p.cw?.aanv??0,gem:p=>p.cw?.gem??null,c1:p=>cwlSterren(p,m1)?.sterren??null,c2:p=>cwlSterren(p,m2)?.sterren??null},grens={};
 Object.entries(velden).forEach(([k,f])=>{const v=lijst.map(f).filter(x=>x!=null);grens[k]=v.length?[Math.min(...v),Math.max(...v)]:[0,0]});
 const schaal=(k,v)=>{if(v==null)return null;const[a,b]=grens[k];return b>a?(v-a)/(b-a):1},uit=new Map;
 lijst.forEach(p=>{const n=Object.fromEntries(Object.entries(velden).map(([k,f])=>[k,schaal(k,f(p))])),account=.2*(n.th??0)+.25*(n.helden??0)+.15*(n.dieren??0)+.2*(n.equip??0)+.15*(n.troepen??0)+.05*(n.spreuken??0);
  const cwls=[n.c1,n.c2].filter(x=>x!=null),cwl=cwls.length?cwls.reduce((a,b)=>a+b,0)/cwls.length:0,stijging=p.dl||0;
  let score=.25*account+.2*(n.lgn??0)+.1*(n.aanv??0)+.15*(n.gem??0)+.3*cwl+.03*Math.max(-1,Math.min(2,stijging));
  const c=cwlSterren(p,m1),vol=c&&c.sterren>=21;if(vol)score+=.1;
  uit.set(p.tag,{...n,account,accountScore:Math.round(account*100),score:Math.round(Math.max(0,Math.min(score,1))*100),vol,volClan:vol?clanVan(c.clan)?.nr:null})});return uit}

 srt(pool13,a).slice(0,30).forEach((p,x)=>uit[pid(p)]=x<15?x+1:x+1);srt(pool2,b).slice(0,15).forEach((p,x)=>uit[pid(p)]=101+x);return uit}

 const so=z.perSoort,tot={moest:so.oorlog.moest+so.cwl.moest,aanv:so.oorlog.aanv+so.cwl.aanv,sterren:so.oorlog.sterren+so.cwl.sterren,drie:so.oorlog.drie+so.cwl.drie},rij=(n,k,c="")=>`<tr class="${c}"><th scope="row">${n}</th><td class="n">${k.moest}</td><td class="n">${k.aanv}</td><td class="n">${Math.max(0,k.moest-k.aanv)}</td><td class="n ster">${gemTekst(k.sterren,k.aanv)}</td><td class="n">${pctTekst(k.drie,k.aanv)}</td></tr>`;
 const d=z.verdediging,aanval=z.aanvallen.slice(0,60).map(a=>`<tr><td>${datum(iso(a.datum))}</td><td class="opt">${a.soort==="cwl"?`CWL ${a.ronde??""}`:"CW"}</td><td class="opt"><span class="sn blok">${esc(a.tegen)}</span></td><td><span class="sn blok">${esc(a.doel??"Onbekend")}</span>${a.doelTh?`<span class="d">TH ${a.doelTh}</span>`:""}</td><td>${sterRij({sterren:a.sterren,procent:a.procent})}</td><td class="n opt">${mmss(a.duur)}</td></tr>`).join("");
 laadHistorie(tag);const hist=historie[tag]||{},uitHist=k=>D.maanden.map(m=>hist[m]?.[k]??null),reeks=i=>(p.s||[]).map(x=>x?.[i]||null);
 const lijnen=[[reeks(3),"League",leagueNaam],[reeks(0),"Helden"],[reeks(1),"Dieren"],[reeks(2),"Equipment"],[reeks(4),"Spreuken"],[reeks(5),"Troepen"],[uitHist("gem"),"Gem ★, laatste 3-4 mnd",v=>v.toFixed(2).replace(".",",")],[uitHist("drie"),"3 sterren, laatste 3-4 mnd",v=>Math.round(v)+"%"]],gemeten=D.maanden.map((m,j)=>lijnen.some(l=>l[0][j]!=null)?j:null).filter(j=>j!=null),eM=gemeten[0],zM=gemeten[gemeten.length-1],gat=lijnen.some(l=>{const q=l[0].flatMap((v,j)=>v==null?[]:[j]);return q.some((j,k)=>k&&j-q[k-1]>1)}),groei=lijnen.map(l=>grafiek(l[0],l[1],l[2],eM,zM)).join("");
 return `<section class="sectie">${terug}${kop}${tegels}
 <div class="profiel"><div class="paneel"><h3>Oorlogen, laatste ${D.vensterDagen} dagen</h3><div class="tablebox plat"><table><thead><tr><th><span class="kp">Soort</span></th><th class="n"><span class="kp">Aanvallen</span></th><th class="n"><span class="kp">Aanvallen gedaan</span></th><th class="n"><span class="kp">Aanvallen gemist</span></th><th class="n"><span class="kp">Gem ★</span></th><th class="n"><span class="kp">3★</span></th></tr></thead><tbody>${rij("CW",so.oorlog)}${rij("CWL",so.cwl)}${rij("Totaal",tot,"totaalrij")}</tbody></table></div></div>
 <div class="paneel"><h3>Verdediging, laatste ${D.vensterDagen} dagen</h3><div class="tegels klein">${tegel(d.keer,"keer aangevallen")}${tegel(gemTekst(d.sterren,d.keer),"sterren tegen","t-goud")}${tegel(pctTekst(d.drie,d.keer),"3 sterren tegen")}</div></div>
 <div class="paneel"><h3>Helden</h3><ul class="lvls">${z.helden.map(balkRij).join("")}</ul></div>
 <div class="paneel"><h3>Dieren</h3><ul class="lvls">${z.dieren.map(balkRij).join("")||'<li class="weg">Geen dieren</li>'}</ul></div>
  <div class="paneel"><h3>Carrière</h3><div class="tegels klein">${tegel(getal(z.warSterren),"oorlogssterren","t-goud")}${tegel(getal(z.kapitaal),"clankapitaal")}</div></div></div>
 <div class="paneel"><h3>Equipment</h3><div class="eqgrid">${equipmentView(z.equipment)}</div></div>
 ${z.spreuken?.length?`<div class="paneel"><h3>Spreuken</h3><ul class="lvls kolommen">${z.spreuken.map(balkRij).join("")}</ul></div>`:""}
 ${z.troepen?.length?`<div class="paneel"><h3>Troepen</h3><ul class="lvls kolommen">${z.troepen.map(balkRij).join("")}</ul></div>`:""}
 ${groei?`<div class="paneel"><h3>Ontwikkeling per maand</h3><div class="grafieken">${groei}</div>${gat?'<p class="uitleg">Een stippellijn betekent dat de maanden ertussen niet gemeten zijn.</p>':""}</div>`:""}${maandTabel(hist)}
 ${z.gemist.length?`<div class="paneel"><h3>Gemiste aanvallen</h3><ul class="gemist">${z.gemist.map(g=>`<li>${datum(iso(g.datum))}: ${g.aantal} tegen ${esc(g.tegen)} (${g.soort==="cwl"?"CWL":"CW"})</li>`).join("")}</ul></div>`:""}
 <div class="paneel"><h3>Aanvallen</h3>${aanval?`<div class="tablebox plat"><table><thead><tr><th><span class="kp">Datum</span></th><th class="opt"><span class="kp">Soort</span></th><th class="opt"><span class="kp">Tegen clan</span></th><th><span class="kp">Doel</span></th><th><span class="kp">Resultaat</span></th><th class="n opt"><span class="kp">Tijd</span></th></tr></thead><tbody>${aanval}</tbody></table></div>`:'<p class="uitleg">Geen aanvallen in deze periode.</p>'}</div></section>`}
function resttekst(doel){const m=Math.max(0,Math.round((doel-Date.now())/6e4));return `${Math.floor(m/60)}u ${String(m%60).padStart(2,"0")}m`}
const tagNaam=n=>{const p=D.players.find(x=>x.naam===n),w=p&&K(p).whatsapp;return w?"@"+w:n};
function clanBericht(c){const eigen=D.oorlogen.filter(w=>w.clan.tag===c.tag),bezig=eigen.find(w=>w.status==="inWar"),voor=eigen.find(w=>w.status==="preparation"),klaar=eigen.find(w=>w.status==="warEnded"&&Date.now()-tijd(w.einde)<864e5),w=bezig||klaar||voor;
 if(!w)return null;const r=[`🛡️ *${c.naam}* (${soortNaam(w)})`,`tegen ${w.tegenstander.name}`];
 if(w.status==="preparation")r.push(`⏳ Start over ${resttekst(tijd(w.start))}`);
 else{const o=oordeel(w);r.push(`⭐ *${w.clan.stars??0} - ${w.tegenstander.stars??0}* sterren`,`💥 ${pct(w.clan.destructionPercentage)} - ${pct(w.tegenstander.destructionPercentage)}`,`🗡️ ${w.clan.aanvallen??w.gebruikt}/${w.totaal} aanvallen`);
  if(w.status==="inWar"){r.push(`⏳ Nog ${resttekst(tijd(w.einde))}, eindigt ${tijd(w.einde).toLocaleTimeString("nl-NL",{hour:"2-digit",minute:"2-digit"})}`);if(o&&o[0]!=="open")r.push(`🏆 ${o[1]}`);r.push(w.open.length?`❗ Nog aanvallen: ${[...new Set(w.open.map(x=>tagNaam(x.naam)))].join(", ")}`:"✅ Iedereen heeft aangevallen")}
  else{r.push(`🏁 ${o?o[1]:"Afgelopen"}`);if(w.open.length)r.push(`❌ Niet aangevallen: ${[...new Set(w.open.map(x=>tagNaam(x.naam)))].join(", ")}`)}}
 return r.join("\n")}
function berichten(){const uit=[],delen=[...D.clans].sort((a,b)=>(a.nr||0)-(b.nr||0)).map(clanBericht).filter(Boolean);
 if(delen.length)uit.push(["Oorlogsupdate",`⚔️ *EYE ON EYE OORLOGSUPDATE* ⚔️\n_${klok(new Date)}_\n\n${delen.join("\n\n")}\n\n📊 https://thijspros.github.io/eye-on-eye-clan/`]);
 const top=D.players.filter(p=>p.inClan&&p.d&&(p.d.h||p.d.p||p.d.e)).map(p=>[p,p.d.h+p.d.p+p.d.e]).sort((a,b)=>b[1]-a[1]).slice(0,5);
 if(top.length)uit.push(["Groeiers van de maand",`📈 Grootste groei deze maand\n${top.map(([p,g],i)=>`${i+1}. ${p.naam} (+${g})`).join("\n")}`]);
 return uit}
function berichtenView(){const b=berichten();
 return `<section class="sectie"><h2>Berichten voor de appgroep</h2>${b.length?`<div class="berichten">${b.map(([t,x],i)=>`<article class="bericht"><h3>${esc(t)}</h3><textarea id="b${i}" rows="${Math.min(x.split("\n").length+1,16)}" readonly aria-label="${esc(t)}">${esc(x)}</textarea><div class="tools"><a class="knop" href="https://wa.me/?text=${encodeURIComponent(x)}" target="_blank" rel="noopener">Deel in WhatsApp</a><button class="knop licht" data-kopieer="b${i}">Kopieer bericht</button></div></article>`).join("")}</div>`:'<p class="uitleg">Er zijn nu geen berichten om te delen.</p>'}</section>`}

function route(){const h=decodeURIComponent(location.hash.slice(1));if(h.startsWith("speler/")){spelerTag=h.slice(7);tab="speler";return}tab=TABS.some(x=>x[0]===h)?h:"overzicht"}
function nav(){const actief=tab==="speler"?"spelers":tab;$("nav").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}"${actief===k?' aria-current="page"':""}>${t}</button>`).join("")}
function merk(){const c=D.clans.find(x=>x.nr===1);if(!c)return;$("merknaam").textContent=c.naam;if(c.logo)$("merklogo").outerHTML=`<img id="merklogo" class="logo" src="${esc(c.logo)}" width="44" height="44" alt="">`}
function render(){merk();nav();$("muur").innerHTML=tab==="overzicht"?muur():"";document.querySelector(".wall").classList.toggle("laag",tab!=="overzicht");$("voet").textContent=`Bijgewerkt ${klok(new Date(D.bijgewerkt))}. `;$("inhoud").innerHTML={overzicht:overzichtView,spelers:spelersView,opstelling:opstellingView,oorlogen:oorlogenView,roof:roofView,games:gamesView,berichten:berichtenView,speler:spelerView}[tab]();if(tab==="spelers")teller()}

 const of=e.target.closest("[data-of]");if(of){oorlogClan=of.dataset.of;oorlogAantal=100;render();return}
 const os=e.target.closest("[data-os]");if(os){oorlogSoort=os.dataset.os;oorlogAantal=100;render();return}
 const rd=e.target.closest("[data-ronde]");if(rd){const f=document.querySelector(".front")?.scrollLeft;rondeKeuze[rd.dataset.kclan]=+rd.dataset.ronde;render();document.querySelector(".front").scrollLeft=f;return}
 const cv=e.target.closest("[data-cwlv]");if(cv){cwlWeergave[cv.dataset.cwlv]=cv.dataset.w;$("inhoud").innerHTML=overzichtView();return}
 const cr=e.target.closest("[data-cwlr]");if(cr){cwlRonde[cr.dataset.cwlr]=+cr.dataset.n;$("inhoud").innerHTML=overzichtView();return}
 const bk=e.target.closest("[data-bak]");if(bk){bakPool=bk.dataset.bak;render();return}
 if(e.target.closest("[data-bakvrij]")){bakVrij=!bakVrij;render();return}
 const bs=e.target.closest("[data-baksort]");if(bs){bakSort=bs.dataset.baksort;render();return}

 const k=e.target.closest("[data-k]");if(k){const c=k.dataset.k;if(sort.k===c)sort.dir*=-1;else sort={k:c,dir:c==="naam"?1:-1};tabel();return}
 const o=e.target.closest("[data-open]");if(o){const i=decodeURIComponent(o.dataset.open);open.has(i)?open.delete(i):open.add(i);tabel();return}
 const vl=e.target.closest("[data-vakleeg]");if(vl){if(confirm("Alle spelers uit de opstelling van deze clan halen?"))leegVak(+vl.dataset.vakleeg);return}
 const va=e.target.closest("[data-vakadvies]");if(va){if(confirm("De opstelling van deze clan vervangen door het advies?"))adviesVak(+va.dataset.vakadvies);return}
 const b=e.target.closest("[data-actie]");if(b){const a=b.dataset.actie;
  if(a==="sleutel"){const w=$("sleutel").value.trim();if(w){sleutelZet(w);opslaan()}}
