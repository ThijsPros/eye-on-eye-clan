<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eye on Eye</title>
<meta name="theme-color" content="#12337A">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Lilita One";src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:400;src:url(fonts/rubik-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:500;src:url(fonts/rubik-latin-500-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Rubik;font-weight:700;src:url(fonts/rubik-latin-700-normal.woff2) format("woff2");font-display:swap}

:root{
 --night:#12337A;--night-deep:#0C2559;--gold:#F2B632;--on-night:#FFFFFF;--on-night-soft:#C4D2EE;
 --page:#E8EDF5;--surface:#FFFFFF;--ink:#14203A;--muted:#55607A;--line:#D3DAE6;--star:#946100;
 --good:#17804A;--bad:#C2332B;
 --c1:#F2B632;--c1t:#3A2800;--c2:#2F7DE1;--c2t:#FFFFFF;--c3:#CF3F35;--c3t:#FFFFFF;--c4:#238A5C;--c4t:#FFFFFF;
 --display:"Lilita One","Arial Black",Arial,sans-serif;--body:Rubik,"Segoe UI",Arial,sans-serif;
 color-scheme:light}
@media (prefers-color-scheme:dark){:root{
 --night:#17408F;--night-deep:#102F70;--page:#0E1830;--surface:#172444;--ink:#EAF0FB;--muted:#A6B3CE;--line:#2C3B63;--star:#F2B632;
 --good:#62CF95;--bad:#FF9A92;color-scheme:dark}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font:400 16px/1.45 var(--body);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.05}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:3px}
.inner{max-width:1120px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left))}

/* De muur: blauwe kop met kantelen als enige blikvanger. */
.wall{position:relative;background:var(--night);color:var(--on-night);padding-bottom:44px}
.wall.laag{padding-bottom:30px}
.wall::after{content:"";position:absolute;inset:auto 0 0;height:22px;background:repeating-linear-gradient(90deg,var(--page) 0 30px,transparent 30px 66px)}
.top{display:flex;flex-wrap:wrap;gap:4px 20px;align-items:center;justify-content:space-between;padding-block:18px 14px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font-size:30px;letter-spacing:.01em}
.nav{display:flex;gap:4px}
.nav button{all:unset;cursor:pointer;font:400 18px/1 var(--display);padding:10px 14px;border-radius:6px;color:var(--on-night-soft)}
.nav button[aria-current="page"]{background:var(--gold);color:#2B1E00}
.nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.fresh{font-size:14px;color:var(--on-night-soft);margin:0}
.warhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:2px 16px;margin:14px 0 6px}
.warhead h2{font-size:34px}

.front{display:grid;gap:0}
.war{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:4px 14px;align-items:center;padding-block:14px;border-top:1px solid rgb(255 255 255/.18)}
.war .wie{min-width:0}
.war .wie b{display:block;font:400 21px/1.15 var(--display)}
.war .wie span{display:block;color:var(--on-night-soft);font-size:14px;overflow-wrap:anywhere}
.war .stand{font:400 40px/1 var(--display);text-align:right;white-space:nowrap}
.war .stand i{font-style:normal;color:var(--gold)}
.war .stand small{font:inherit;color:var(--on-night-soft)}
.war .start{text-align:right;font-size:14px;line-height:1.25;color:var(--on-night-soft)}
.war .start b{color:var(--on-night);font-weight:500}
.tug{grid-column:1/-1;display:flex;height:10px;gap:3px;margin-top:6px}
.tug i{display:block;min-width:3px}
.tug .ons{background:var(--gold);border-radius:3px 0 0 3px}
.tug .zij{background:rgb(255 255 255/.32);border-radius:0 3px 3px 0}
.warinfo{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 16px;font-size:14px;color:var(--on-night-soft)}
details.open{grid-column:1/-1;font-size:14px}
details.open summary{cursor:pointer;font-weight:500;color:var(--on-night);padding-block:3px}
details.open p{margin:4px 0 0;color:var(--on-night-soft)}
.rust{padding-block:16px;border-top:1px solid rgb(255 255 255/.18);color:var(--on-night-soft)}

main{display:block;padding-block:22px 40px}
.sectie{display:grid;gap:14px;min-width:0}
.sectie+.sectie{margin-top:30px}
.sectie>h2{font-size:26px}

/* Clans: rijen met schild, geen losse kaartjes. */
.clans{background:var(--surface);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.clan{display:grid;grid-template-columns:52px minmax(0,1.3fr) repeat(3,minmax(84px,1fr));gap:4px 16px;align-items:center;padding:14px 16px;border-top:1px solid var(--line)}
.clan:first-child{border-top:0}
.clan h3{font-size:21px}
.clan .rol{color:var(--muted);font-size:14px}
.feit{font-size:14px;color:var(--muted)}
.feit b{display:block;font:500 17px/1.2 var(--body);color:var(--ink)}
.feit b.ster{color:var(--star)}
.waarschuwing{grid-column:2/-1;color:var(--bad);font-size:14px}
.shield{display:block}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input,select{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
#zoek{flex:1 1 180px;max-width:300px}
.teller{color:var(--muted);font-size:14px}
.uitleg{margin:0;color:var(--muted);font-size:14px;max-width:72ch}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font:500 13px/1.2 var(--body);text-align:left;color:var(--muted);border-bottom:2px solid var(--line);padding:0;white-space:nowrap}
th button{all:unset;cursor:pointer;display:block;padding:10px 8px}
th.n,td.n{text-align:right}
th[aria-sort="ascending"] button::after{content:" ▲";font-size:10px}
th[aria-sort="descending"] button::after{content:" ▼";font-size:10px}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
.speler{display:flex;align-items:center;gap:8px;min-width:0}
.naam{all:unset;cursor:pointer;font-weight:500;display:block;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.naam:focus-visible{outline:3px solid var(--gold)}
.d{display:block;font-size:12px;line-height:1.1;color:var(--muted)}
.d.up{color:var(--good)}.d.down{color:var(--bad)}
.kort{display:none}
.tal{font-weight:700;color:var(--good)}
.tal.bad{color:var(--bad)}
.ster{color:var(--star);font-weight:500}
.weg{color:var(--muted);font-size:13px}
.detail td{white-space:normal;background:color-mix(in srgb,var(--night) 6%,var(--surface))}
.dgrid{display:flex;flex-wrap:wrap;gap:12px 28px;padding:6px 0}
.spark{display:grid;gap:2px;font-size:13px;color:var(--muted)}
.spark svg{display:block;width:140px;height:38px;color:var(--c2)}
.spark polyline{fill:none;stroke:currentColor;stroke-width:1.8}
.spark circle{fill:currentColor}
.spark b{color:var(--ink);font-weight:500}

.lijst{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.uitslag{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.uitslag:first-child{border-top:0}
.uitslag .wie b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uitslag .wie span{display:block;color:var(--muted);font-size:14px}
.uitslag .sc{font:400 24px/1 var(--display);text-align:right}
.uitslag .sc.win{color:var(--good)}.uitslag .sc.ver{color:var(--bad)}
.uitslag .sc small{display:block;font:400 13px/1.3 var(--body);color:var(--muted)}

.berichten{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px;align-items:start}
.bericht{display:grid;gap:8px;min-width:0}
.bericht h3{font-size:20px}
textarea{width:100%;resize:vertical;font:inherit;font-size:15px;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.knop{all:unset;cursor:pointer;justify-self:start;font-weight:500;background:var(--night);color:#fff;border-radius:6px;padding:9px 14px}
.knop:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.melding{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--bad);border-radius:6px;padding:10px 14px;margin:0}
footer{padding-block:0 28px;color:var(--muted);font-size:13px}

@media (max-width:720px){
 body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
 .nav{position:fixed;z-index:5;inset:auto 0 0;background:var(--night-deep);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
 .nav button{flex:1;text-align:center;font-size:17px;padding:12px 2px}
 .wall{padding-bottom:40px}
 .wall.laag{padding-bottom:26px}
 .warhead h2{font-size:30px}
 .war .stand{font-size:34px}
 .clan{grid-template-columns:44px repeat(3,minmax(0,1fr));gap:8px 10px}
 .clan .kop{grid-column:2/-1}
 .clan .feit:nth-of-type(1){grid-column:2}
 .waarschuwing{grid-column:2/-1}
 .opt{display:none}
 .naam{max-width:104px}
 td,th button{padding-inline:5px}
 .kort{display:inline}.lang{display:none}
 td:first-child,th:first-child button{padding-left:8px}
 td:last-child,th:last-child button{padding-right:8px}
}
@media (prefers-reduced-motion:no-preference){
 .tug i{transition:width .5s ease}
}
</style>
</head>
<body>
<header class="wall">
 <div class="inner">
  <div class="top">
   <div class="brand"><svg class="shield" width="30" height="34" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="#F2B632"/><circle cx="20" cy="22" r="9" fill="#12337A"/><circle cx="20" cy="22" r="4" fill="#fff"/></svg><h1>Eye on Eye</h1></div>
   <nav class="nav" id="nav" aria-label="Onderdelen"></nav>
  </div>
  <div id="muur"></div>
 </div>
</header>
<main class="inner" id="inhoud" tabindex="-1"></main>
<footer class="inner"><span id="voet"></span>Fan-pagina, niet verbonden aan of goedgekeurd door Supercell. Gegevens uit de Clash of Clans API.</footer>
<script>
const TABS=[["overzicht","Overzicht"],["spelers","Spelers"],["oorlogen","Oorlogen"],["berichten","Berichten"]];
const $=i=>document.getElementById(i);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const MND=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const iso=s=>s?`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}`:null;
const datum=s=>{if(!s)return"–";const[y,m,d]=s.slice(0,10).split("-");return `${+d} ${MND[m-1]} ${y}`};
const tijd=s=>s?new Date(`${iso(s)}T${s.slice(9,11)}:${s.slice(11,13)}:${s.slice(13,15)}Z`):null;
const klok=d=>d.toLocaleString("nl-NL",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const duur=d=>{const m=Math.max(0,Math.round((d-Date.now())/6e4)),u=Math.floor(m/60);return u?`${u} uur ${m%60} min`:`${m} min`};
const ROMEINS=["","I","II","III","IV"];
let D,tab="overzicht",sort={k:"lgn",dir:-1},zoek="",filter="",clanFilter="",open=new Set;
const clanVan=t=>D.clans.find(c=>c.tag===t);
function schild(nr,maat=40){if(!nr)return `<svg class="shield" width="${maat}" height="${maat*1.15}" viewBox="0 0 40 46" aria-hidden="true"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="none" stroke="currentColor" stroke-width="2" opacity=".45"/></svg>`;
 return `<svg class="shield" width="${maat}" height="${maat*1.15}" viewBox="0 0 40 46" role="img" aria-label="Clan ${ROMEINS[nr]}"><path d="M20 1 38 7v16c0 11-8 18-18 22C10 41 2 34 2 23V7z" fill="var(--c${nr})"/><text x="20" y="28" text-anchor="middle" font-family="Lilita One,Arial Black,sans-serif" font-size="${nr>2?17:20}" fill="var(--c${nr}t)">${ROMEINS[nr]}</text></svg>`}

// Bron van de aanvalscijfers: ClashSpot tot er genoeg eigen oorlogen zijn.
const aanv=p=>D.vensterVol?(p.cw?.aanv??0):(p.cs?.aanv??null);
const gem=p=>D.vensterVol?(p.cw?.gem??null):(p.cs?.gem??null);
const laag=p=>aanv(p)!=null&&aanv(p)<D.grensAanvallen;
const COLS=[["naam","Speler"],["th","TH",1,1],["lgn","League"],["helden","Helden",1,1],["dieren","Dieren",1,1],["equip","Equipment",1,1],["aanv","Aanvallen",1,0,"Aanv"],["gem","Gem ★",1],["eigen","Eigen telling",1,1],["gemis","Gemist",1,1],["don","Donaties",1,1]];
const waarde=(p,k)=>k==="aanv"?aanv(p):k==="gem"?gem(p):k==="eigen"?(p.cw?.aanv??null):k==="gemis"?(p.cw?.gemis??null):p[k];

function oorlogRij(w){const eind=tijd(w.einde),start=tijd(w.start),c=clanVan(w.clan.tag),bezig=w.status==="inWar";
 const ons=w.clan.stars||0,zij=w.tegenstander.stars||0,som=ons+zij||1;
 const soort=w.soort==="cwl"?`CWL ronde ${w.ronde??"?"}`:"Clanoorlog";
 return `<article class="war">${schild(c?.nr,44)}
 <div class="wie"><b>${esc(w.clan.name)}</b><span>${soort} tegen ${esc(w.tegenstander.name)}</span></div>
 ${bezig?`<div class="stand" aria-label="Stand ${ons} tegen ${zij} sterren"><i>${ons}</i> <small>–</small> ${zij}</div>`:`<div class="start">Start over<br><b>${duur(start)}</b></div>`}
 ${bezig?`<div class="tug" aria-hidden="true"><i class="ons" style="width:${100*ons/som}%"></i><i class="zij" style="width:${100*zij/som}%"></i></div>
 <div class="warinfo"><span>${w.gebruikt} van ${w.totaal} aanvallen gebruikt</span><span>Nog ${duur(eind)}</span></div>
 ${w.open.length?`<details class="open"><summary>${w.open.length} ${w.open.length===1?"speler moet":"spelers moeten"} nog aanvallen</summary><p>${w.open.map(o=>esc(o.naam)+(o.over>1?` (${o.over})`:"")).join(", ")}</p></details>`:""}`:""}</article>`}
function muur(){const w=D.oorlogen.filter(x=>x.status==="inWar"||x.status==="preparation");
 w.sort((a,b)=>(a.status==="inWar"?0:1)-(b.status==="inWar"?0:1)||(clanVan(a.clan.tag)?.nr||9)-(clanVan(b.clan.tag)?.nr||9));
 return `<div class="warhead"><h2>Oorlogen nu</h2><p class="fresh">Bijgewerkt ${klok(new Date(D.bijgewerkt))}</p></div>
 <div class="front">${w.map(oorlogRij).join("")||'<p class="rust">Geen enkele clan is nu in oorlog.</p>'}</div>`}

function overzichtView(){return `<section class="sectie"><h2>Onze clans</h2><div class="clans">${[...D.clans].sort((a,b)=>(a.nr||0)-(b.nr||0)).map((c,i)=>{const sp=D.players.filter(p=>p.clanTag===c.tag&&gem(p)!=null);
 const g=sp.length?(sp.reduce((a,p)=>a+gem(p),0)/sp.length).toFixed(2):"–";
 return `<article class="clan">${schild(c.nr??i+1,44)}<div class="kop"><h3>${esc(c.naam)}</h3><div class="rol">${esc(c.rol??"")}</div></div>
 <div class="feit"><b>${c.leden??"–"}</b>leden</div><div class="feit"><b>${esc((c.warLeague??"–").replace(" League",""))}</b>CWL-league</div><div class="feit"><b class="ster">${g}</b>gem. sterren</div>
 ${c.oorlogslog==="privé"?'<div class="waarschuwing">Oorlogslog staat op privé. Zet deze op openbaar om oorlogen van deze clan te bewaren.</div>':""}</article>`}).join("")}</div></section>`}

function delta(v){return v==null?'<span class="d">–</span>':v===0?'<span class="d">±0</span>':`<span class="d ${v>0?"up":"down"}">${v>0?"+":""}${v}</span>`}
function spark(p,i,label){const pts=p.s.map((x,j)=>x?[j,x[i]]:null).filter(q=>q&&q[1]!=null);if(pts.length<2)return"";
 const vs=pts.map(q=>q[1]),a=Math.min(...vs),b=Math.max(...vs),n=p.s.length-1,X=j=>3+j*134/n,Y=v=>34-(v-a)/(b-a||1)*30,l=pts[pts.length-1];
 return `<div class="spark"><span>${label}: <b>${vs[0]} → ${l[1]}</b></span><svg viewBox="0 0 140 38" role="img" aria-label="${label} van ${vs[0]} naar ${l[1]}"><polyline points="${pts.map(q=>X(q[0]).toFixed(1)+","+Y(q[1]).toFixed(1)).join(" ")}"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="2.6"/></svg></div>`}
function detail(p,cols){const f=(k,v)=>`<div class="feit"><b>${esc(v??"–")}</b>${k}</div>`,c=p.cw||{},s=p.cs||{};
 return `<tr class="detail"><td colspan="${cols}"><div class="dgrid">${spark(p,0,"Helden")}${spark(p,1,"Dieren")}${spark(p,2,"Equipment")}
 ${f("Clan",p.inClan?p.clan:(p.clan?p.clan+" (buiten onze clans)":"Geen clan"))}${p.vorigeClan?f("Vorige clan",`${p.vorigeClan} (tot ${datum(p.overstap)})`):""}${f("TH",p.th)}${f("Helden",p.helden)}${f("Dieren",p.dieren)}${f("Equipment",p.equip)}${f("ClashSpot aanvallen",s.aanv)}${f("Eigen telling",c.aanv)}${f("Gemist",c.gemis)}${f("3 sterren",c.drieProcent!=null?Math.round(c.drieProcent)+"%":null)}${f("Laatste oorlog",c.laatste?datum(c.laatste):s.laatste?datum(s.laatste):null)}${f("Donaties",p.don)}${f("Rol",p.rol)}${f("Tag",p.tag)}</div></td></tr>`}
function zichtbaar(){const l=D.players.filter(p=>{
 if(zoek&&!p.naam.toLowerCase().includes(zoek))return false;
 if(clanFilter==="uit")return !p.inClan;if(clanFilter&&p.clanTag!==clanFilter)return false;
 if(filter==="laag")return laag(p);if(filter==="gemist")return (p.cw?.gemis||0)>0;return true});
 const e=v=>v==null||v==="";
 return [...l].sort((a,b)=>{const x=waarde(a,sort.k),y=waarde(b,sort.k);if(e(x)&&e(y))return 0;if(e(x))return 1;if(e(y))return -1;return (typeof x==="string"?x.localeCompare(y,"nl"):x-y)*sort.dir})}
function rijen(){return zichtbaar().map(p=>{const d=p.d||{},a=aanv(p),i=encodeURIComponent(p.tag),c=p.inClan?clanVan(p.clanTag):null;
 return `<tr><td><div class="speler">${schild(c?.nr,20)}<button class="naam" data-open="${i}" aria-expanded="${open.has(p.tag)}">${esc(p.naam)}</button></div></td>
 <td class="n opt">${p.th??"–"}</td><td>${esc(p.league)}${d.l?delta(d.l):""}</td>
 <td class="n opt">${p.helden}${delta(d.h)}</td><td class="n opt">${p.dieren}${delta(d.p)}</td><td class="n opt">${p.equip}${delta(d.e)}</td>
 <td class="n">${a==null?"–":`<span class="tal ${laag(p)?"bad":""}">${a}</span>`}</td><td class="n ster">${gem(p)!=null?gem(p).toFixed(2):"–"}</td>
 <td class="n opt">${p.cw?.aanv??"–"}</td><td class="n opt">${p.cw?.gemis??"–"}</td><td class="n opt">${p.don}</td></tr>${open.has(p.tag)?detail(p,COLS.length):""}`}).join("")}
function kop(){return COLS.map(([k,t,n,o,kort])=>`<th class="${n?"n ":""}${o?"opt":""}" aria-sort="${sort.k===k?(sort.dir>0?"ascending":"descending"):"none"}"><button data-k="${k}">${kort?`<span class="lang">${t}</span><span class="kort">${kort}</span>`:t}</button></th>`).join("")}
function spelersView(){return `<section class="sectie"><h2>Spelers</h2>
 <p class="uitleg">${D.vensterVol?`Aanvallen over de laatste ${D.vensterDagen} dagen, in al onze clans samen.`:`Aanvallen en gemiddelde komen nog uit ${esc(D.exportLabel)}. Na ${D.vensterDagen} dagen telt de site dit zelf, in al onze clans samen.`} Rood is minder dan ${D.grensAanvallen} aanvallen. Tik op een naam voor meer.</p>
 <div class="tools"><input id="zoek" type="search" placeholder="Zoek speler" aria-label="Zoek speler" value="${esc(zoek)}">
 <select id="clanf" aria-label="Filter op clan"><option value="">Alle clans</option>${D.clans.map(c=>`<option value="${esc(c.tag)}"${clanFilter===c.tag?" selected":""}>${esc(c.naam)}</option>`).join("")}<option value="uit"${clanFilter==="uit"?" selected":""}>Buiten onze clans</option></select>
 <select id="filter" aria-label="Filter spelers"><option value="">Alle spelers</option><option value="laag"${filter==="laag"?" selected":""}>Onder ${D.grensAanvallen} aanvallen</option><option value="gemist"${filter==="gemist"?" selected":""}>Met gemiste aanvallen</option></select>
 <span class="teller" id="teller"></span></div>
 <div class="tablebox"><table><thead><tr id="kop">${kop()}</tr></thead><tbody id="rijen">${rijen()}</tbody></table></div></section>`}

function oorlogenView(){const w=D.oorlogen.filter(x=>x.status==="warEnded"||x.status==="onvolledig");
 if(!w.length)return '<section class="sectie"><h2>Uitslagen</h2><p class="uitleg">Nog geen afgelopen oorlogen opgeslagen. Lopende oorlogen staan bovenaan.</p></section>';
 return `<section class="sectie"><h2>Uitslagen</h2><div class="lijst">${w.map(x=>{const c=clanVan(x.clan.tag),a=x.clan.stars??0,b=x.tegenstander.stars??0,win=a>b||(a===b&&x.clan.destructionPercentage>x.tegenstander.destructionPercentage),heel=x.status==="warEnded";
  return `<article class="uitslag">${schild(c?.nr,32)}<div class="wie"><b>tegen ${esc(x.tegenstander.name)}</b><span>${x.soort==="cwl"?`CWL ronde ${x.ronde??"?"}`:"Clanoorlog"}, ${datum(iso(x.start))}</span></div>
  <div class="sc ${heel?(win?"win":"ver"):""}">${a} – ${b}<small>${heel?(win?"Gewonnen":"Verloren"):"Einde niet gezien"}, ${x.gebruikt}/${x.totaal}</small></div></article>`}).join("")}</div></section>`}

function berichten(){const uit=[];
 D.oorlogen.filter(w=>w.status==="inWar").forEach(w=>{const namen=w.open.map(o=>`- ${o.naam}${o.over>1?` (${o.over} over)`:""}`).join("\n");
  uit.push([`Herinnering ${w.clan.name}`,`⚔️ ${w.clan.name} tegen ${w.tegenstander.name}\nStand: ${w.clan.stars} - ${w.tegenstander.stars}\nDe oorlog eindigt ${klok(tijd(w.einde))}.\n\n${namen?"Nog aanvallen:\n"+namen:"Iedereen heeft aangevallen. Top!"}`])});
 const w=D.oorlogen.find(x=>x.status==="warEnded");
 if(w){const t=w.clan.stars>w.tegenstander.stars?"Gewonnen! 🎉":w.clan.stars<w.tegenstander.stars?"Verloren.":"Gelijke sterren.";
  uit.push([`Laatste uitslag ${w.clan.name}`,`🏁 ${w.clan.name} tegen ${w.tegenstander.name}\n${t}\nSterren: ${w.clan.stars} - ${w.tegenstander.stars}\nAanvallen gebruikt: ${w.gebruikt}/${w.totaal}${w.open.length?"\n\nNiet alles gebruikt:\n"+w.open.map(o=>`- ${o.naam}`).join("\n"):""}`])}
 const top=D.players.filter(p=>p.inClan&&p.d&&(p.d.h||p.d.p||p.d.e)).map(p=>[p,p.d.h+p.d.p+p.d.e]).sort((a,b)=>b[1]-a[1]).slice(0,5);
 if(top.length)uit.push(["Groeiers van de maand",`📈 Grootste groei deze maand\n${top.map(([p,g],i)=>`${i+1}. ${p.naam} (+${g})`).join("\n")}`]);
 return uit}
function berichtenView(){const b=berichten();
 return `<section class="sectie"><h2>Berichten voor de appgroep</h2>${b.length?`<div class="berichten">${b.map(([t,x],i)=>`<article class="bericht"><h3>${esc(t)}</h3><textarea id="b${i}" rows="${Math.min(x.split("\n").length+1,16)}" readonly aria-label="${esc(t)}">${esc(x)}</textarea><button class="knop" data-kopieer="b${i}">Kopieer bericht</button></article>`).join("")}</div>`:'<p class="uitleg">Er zijn nu geen berichten om te delen.</p>'}</section>`}

function nav(){$("nav").innerHTML=TABS.map(([k,t])=>`<button data-tab="${k}"${tab===k?' aria-current="page"':""}>${t}</button>`).join("")}
function render(){nav();$("muur").innerHTML=tab==="overzicht"?muur():"";document.querySelector(".wall").classList.toggle("laag",tab!=="overzicht");$("voet").textContent=`Bijgewerkt ${klok(new Date(D.bijgewerkt))}. `;$("inhoud").innerHTML={overzicht:overzichtView,spelers:spelersView,oorlogen:oorlogenView,berichten:berichtenView}[tab]();if(tab==="spelers")teller()}
function teller(){$("teller").textContent=`${zichtbaar().length} spelers`}
function tabel(){$("rijen").innerHTML=rijen();$("kop").innerHTML=kop();teller()}

addEventListener("click",async e=>{const t=e.target.closest("[data-tab]");if(t){tab=t.dataset.tab;history.replaceState(null,"","#"+tab);render();return}
 const k=e.target.closest("[data-k]");if(k){const c=k.dataset.k;if(sort.k===c)sort.dir*=-1;else sort={k:c,dir:c==="naam"?1:-1};tabel();return}
 const o=e.target.closest("[data-open]");if(o){const i=decodeURIComponent(o.dataset.open);open.has(i)?open.delete(i):open.add(i);tabel();return}
 const c=e.target.closest("[data-kopieer]");if(c){const v=$(c.dataset.kopieer);try{await navigator.clipboard.writeText(v.value);c.textContent="Gekopieerd"}catch{v.select();c.textContent="Selecteer de tekst en kopieer zelf"}setTimeout(()=>c.textContent="Kopieer bericht",2200)}});
addEventListener("input",e=>{if(e.target.id==="zoek"){zoek=e.target.value.trim().toLowerCase();tabel()}});
addEventListener("change",e=>{if(e.target.id==="filter"){filter=e.target.value;tabel()}if(e.target.id==="clanf"){clanFilter=e.target.value;tabel()}});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(D&&TABS.some(x=>x[0]===h)&&h!==tab){tab=h;render()}});

(async()=>{const h=location.hash.slice(1);if(TABS.some(x=>x[0]===h))tab=h;nav();
 try{const r=await fetch("data/latest.json",{cache:"no-store"});if(!r.ok)throw new Error(r.status);D=await r.json();render();
  if((Date.now()-new Date(D.bijgewerkt))/36e5>12)$("inhoud").insertAdjacentHTML("afterbegin",'<p class="melding" style="margin-bottom:18px">Deze gegevens zijn ouder dan 12 uur. Controleer de workflow in GitHub Actions.</p>')}
 catch{$("inhoud").innerHTML='<p class="melding">De clandata kon niet worden geladen. Vernieuw de pagina om het opnieuw te proberen.</p>'}})();
</script>
</body>
</html>
