name: Clandata bijwerken

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clandata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: python scripts/fetch.py
      - name: Data controleren
        run: python scripts/check_data.py
      - name: Data opslaan
        run: |
          git config user.name "eye-on-eye-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Clandata bijwerken"
          for poging in 1 2 3 4 5; do
            git pull --rebase && git push && exit 0
            echo "Opslaan mislukt, poging $poging. Opnieuw over $((poging * 20)) seconden."
            sleep $((poging * 20))
          done
          exit 1
