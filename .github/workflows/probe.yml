name: probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          python3 - <<'P'
          import json,os,urllib.request,urllib.error,collections
          def g(u):
              r=urllib.request.Request(u,headers={"Authorization":"Bearer "+os.environ["COC_API_KEY"]})
              x=urllib.request.urlopen(r,timeout=60);return json.load(x)
          for t in "80YULR99P,QL9JCJ29G,QUYLU8C0,9J8Y822CG,G9UJ0LGU9,PP998PVG,PVUJCYV,2RGVVJGY9,8PLCQJ0RR,22RU8Y0Y0,LRYLCCY,8GJ908Q99,GCGRLGJ0R,GU9YQP0CV,GCL0YJUCV".split(",")[:9]:
              i=g(f"https://cocproxy.royaleapi.dev/v1/players/%23{t}/battlelog")["items"]
              print("O",t,[str(x.get("battleTimestamp"))[4:8]+("a" if x["attack"] else "d")+x["battleType"][0] for x in i][:6],[str(x.get("battleTimestamp"))[4:8]+("a" if x["attack"] else "d")+x["battleType"][0] for x in i][-3:])
              c=collections.Counter(str(x.get("battleTimestamp"))[:8] for x in i if x["attack"] and x["battleType"] in("ranked","legend"));print("D",sorted(c.items()))
              print("X",json.dumps({k:v for k,v in i[0].items() if k in("battleTime","battleTimestamp","stars","destructionPercentage","battleType","attack")}))
          P
