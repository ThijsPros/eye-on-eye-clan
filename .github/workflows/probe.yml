name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          python3 - <<'P'
          import json,os,urllib.request
          for pad in ['/warleagues?limit=100','/leaguetiers?limit=100']:
              r=json.load(urllib.request.urlopen(urllib.request.Request('https://cocproxy.royaleapi.dev/v1'+pad,headers={'Authorization':'Bearer '+os.environ['COC_API_KEY']}),timeout=60))
              print('LIJST',pad,len(r['items']),[(x['id'],x['name']) for x in r['items']])
          P
