name: Tijdelijke controle
on:
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          cat > /tmp/p.py <<'PY'
          import json,os,urllib.request,urllib.parse,base64,time
          B="https://cocproxy.royaleapi.dev/v1"
          def g(u):
              h={"Accept":"application/json","Authorization":"Bearer "+os.environ["COC_API_KEY"]}
              t=time.time()
              try:
                  r=urllib.request.urlopen(urllib.request.Request(B+u,headers=h),timeout=90);d=json.load(r);print("  duur",round(time.time()-t,1));return r.status,d
              except urllib.error.HTTPError as e: return e.code,e.read()[:200]
              except Exception as e: return 0,str(e)[:120]
          s,d=g("/leagues/29000022/seasons");it=d["items"];print([x["id"] for x in it[-6:]],it[0]["id"])
          L=json.load(open("docs/data/latest.json"));eig={p["tag"]:p["naam"] for p in L["players"] if p.get("league","").startswith("Legend")}
          for sid in [x["id"] for x in it[-2:]]:
              q=urllib.parse.quote(sid,safe="")
              s,d=g(f"/leagues/29000022/seasons/{q}?limit=3");print(sid,s,str(d)[:500])
              for pos in (9999,10000,14999):
                  c=base64.urlsafe_b64encode(json.dumps({"pos":pos},separators=(",",":")).encode()).decode().rstrip("=")
                  s,d=g(f"/leagues/29000022/seasons/{q}?limit=1&after={c}");print(" pos",pos,s,str(d)[:260])
              s,d=g(f"/leagues/29000022/seasons/{q}?limit=10000")
              if isinstance(d,dict):
                  r=d.get("items",[]);print(" lijst",len(r),"paging",d.get("paging"),"laatste",str(r[-1])[:200] if r else "")
                  print(" ons",[(eig[x["tag"]],x.get("rank"),x.get("trophies")) for x in r if x["tag"] in eig])
          print("EINDE")
          PY
          python3 /tmp/p.py
