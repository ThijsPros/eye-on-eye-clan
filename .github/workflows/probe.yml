name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse
          r=json.load(urllib.request.urlopen(urllib.request.Request('https://api.clashk.ing/cwl/'+urllib.parse.quote('#PYQ2RLCQ',safe='')+'/2026-10-02',headers={'User-Agent':'eye-on-eye'}),timeout=120))
          t=sorted({x['tag'] for x in r['clans']});ix={c:i for i,c in enumerate(t)}
          print('SCHEMA',json.dumps([sorted(sorted((ix[w['clan']['tag']],ix[w['opponent']['tag']])) for w in rd['warTags']) for rd in r['rounds']],separators=(',',':')))
          P
