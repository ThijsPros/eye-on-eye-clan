name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse
          q=urllib.parse.quote('#PYQ2RLCQ',safe='')
          def g(u,t):
              try:
                  b=urllib.request.urlopen(urllib.request.Request('https://api.clashk.ing'+u,headers={'User-Agent':'eye-on-eye'}),timeout=t).read().decode();print('OK',u,len(b),b[:300]);return json.loads(b)
              except Exception as e:
                  print('ERR',u,e,str(getattr(e,'read',lambda:b'')()[:150]))
          for u in [f'/cwl/{q}/2026-10-02',f'/cwl/{q}/group',f'/v2/cwl/{q}/group?season=2026-10-02']:
              r=g(u,120)
              if isinstance(r,dict) and r.get('rounds'):
                  print('RONDES',len(r['rounds']),json.dumps(r['rounds'])[:500])
          P
