name: Tijdelijke controle
on:
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          cat > /tmp/p.py <<'PY'
          import json,os,urllib.request,urllib.parse
          B="https://cocproxy.royaleapi.dev/v1"
          q=lambda t:urllib.parse.quote(t,safe="")
          def g(u):
              h={"Accept":"application/json","Authorization":"Bearer "+os.environ["COC_API_KEY"]}
              try:
                  r=urllib.request.urlopen(urllib.request.Request(B+u,headers=h),timeout=60);return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,e.read()[:200]
              except Exception as e: return 0,str(e)[:120]
          s,c=g("/clans/"+q("#2RGYGLVC0"));m=c["memberList"][0]["tag"]
          s,p=g("/players/"+q(m));gt,si,gv,sv=p["currentLeagueGroupTag"],p["currentLeagueSeasonId"],p["previousLeagueGroupTag"],p["previousLeagueSeasonId"]
          print(gt,si,gv,sv)
          for u in ["/leaguegroup/"+q(gt)+"/"+str(si)+"?playerTag="+q(m),"/leaguegroup/"+q(gv)+"/"+str(sv)+"?playerTag="+q(m)]:
              s,d=g(u);print(u[:50],s,list(d.keys()) if isinstance(d,dict) else d)
              if isinstance(d,dict):
                  for k,v in d.items():
                      print(" ",k,type(v).__name__,len(v) if hasattr(v,"__len__") else v,json.dumps(v)[:600])
          print("EINDE")
          PY
          python3 /tmp/p.py
