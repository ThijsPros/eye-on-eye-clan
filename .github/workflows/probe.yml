name: Tijdelijke controle
on:
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          cat > /tmp/p.py <<'PY'
          import json,os,urllib.request,urllib.parse,collections
          B="https://cocproxy.royaleapi.dev/v1";K="https://api.clashk.ing"
          q=lambda t:urllib.parse.quote(t,safe="")
          def g(u,auth=True):
              h={"Accept":"application/json","User-Agent":"eye-on-eye-controle"}
              if auth: h["Authorization"]="Bearer "+os.environ["COC_API_KEY"]
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=60);return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,e.read()[:200]
              except Exception as e: return 0,str(e)[:120]
          for t in ("#PYQ2RLCQ","#2RGYGLVC0"):
              s,w=g(K+"/v2/clan/"+q(t)+"/wars?limit=2000",False)
              print(t,"v2",s,len(w) if isinstance(w,list) else str(w)[:200], list(w.keys()) if isinstance(w,dict) else "")
              items=w if isinstance(w,list) else (w.get("items") or []) if isinstance(w,dict) else []
              e=sorted(x.get("endTime","")[:13] for x in items if x.get("endTime","")>="20261010")
              print(" v2 einden >=10-10",e)
              s,o=g(K+"/war/"+q(t)+"/previous?limit=2000",False)
              print(" prev",s,len(o) if isinstance(o,list) else str(o)[:200])
              ol=o if isinstance(o,list) else []
              r=[x for x in ol if x.get("endTime","")[:8] in("20261101","20261030","20260901")]
              for x in r[:3]:
                  c=x["clan"] if x["clan"].get("tag")==t else x["opponent"]
                  print("  ",x.get("endTime"),"keys",sorted(x.keys()),"clankeys",sorted(c.keys()),"leden",len(c.get("members",[])),"aanv",sum(len(m.get("attacks") or []) for m in c.get("members",[])), "tag" ,x.get("tag"),"state",x.get("state"),"prep",x.get("preparationStartTime"),"voorbeeldlid",json.dumps((c.get("members") or [{}])[0])[:300])
              print(" prev leden per maand",collections.Counter((x.get("endTime","")[:6],bool((x["clan"] if x["clan"].get("tag")==t else x["opponent"]).get("members"))) for x in ol if x.get("endTime","")>="202606"))
          s,c=g(B+"/clans/"+q("#PYQ2RLCQ"));m=c["memberList"][:30]
          s,p=g(B+"/players/"+q(m[0]["tag"]))
          g1=p.get("currentLeagueGroupTag");gv=p.get("previousLeagueGroupTag");si=p.get("currentLeagueSeasonId");print("groep",g1,gv,si,p.get("previousLeagueSeasonId"),"lt",p.get("leagueTier"),"wp",p.get("warPreference"),"lbl",p.get("labels"),"ph",str(p.get("playerHouse"))[:100])
          for u in ["/leaguegroup/"+q(str(g1)),"/leaguegroups/"+q(str(g1)),"/leagueGroups/"+q(str(g1)),"/league-groups/"+q(str(g1)),"/leaguegroup/"+q(str(g1))+"/"+str(si),"/leaguetiers","/leagues","/players/"+q(m[0]["tag"])+"/leaguehistory","/players/"+q(m[0]["tag"])+"/league","/leaguehistory/"+q(m[0]["tag"])]:
              s,d=g(B+u);print(u[:40],s,str(d)[:260])
          for u in ["/v2/league/group/"+q(str(g1)),"/v2/leagues/group/"+q(str(g1)),"/v2/player/"+q(m[0]["tag"])+"/league/history","/v2/players/"+q(m[0]["tag"])+"/league/history"]:
              s,d=g(K+u,False);print("CK",u[:50],s,str(d)[:260])
          print("EINDE")
          PY
          python3 /tmp/p.py
