name: Tijdelijke controle
on:
  workflow_dispatch:
jobs:
  controle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vergelijk
        env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          cat > /tmp/p.py <<'PY'
          import json,os,urllib.request,urllib.parse,collections
          B="https://cocproxy.royaleapi.dev/v1";K="https://api.clashk.ing"
          q=lambda t:urllib.parse.quote(t,safe="")
          def g(u,auth=True):
              h={"Accept":"application/json","User-Agent":"eye-on-eye-controle"}
              if auth: h["Authorization"]="Bearer "+os.environ["COC_API_KEY"]
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,headers=h),timeout=60);return r.status,json.load(r)
              except urllib.error.HTTPError as e: return e.code,e.read()[:200]
              except Exception as e: return 0,str(e)[:120]
          for t in ("#PYQ2RLCQ","#2RGYGLVC0"):
              s,o=g(K+"/war/"+q(t)+"/previous?limit=2000",False)
              ol=o.get("items",[]) if isinstance(o,dict) else o
              print(t,"prev",s,len(ol),"keys",list(o.keys()) if isinstance(o,dict) else "")
              e=[x.get("endTime","")[:13] for x in ol]
              print(" hoogste",sorted(e)[-14:])
              print(" per maand",sorted(collections.Counter(x[:6] for x in e if x>="202606").items()))
              for x in [y for y in ol if y.get("endTime","")[:8] in("20261101","20261030","20260901","20261020")][:3]:
                  c=x["clan"] if x["clan"].get("tag")==t else x["opponent"]
                  print("  ",x.get("endTime"),"clankeys",sorted(c.keys()),"leden",len(c.get("members",[])),"aanv",sum(len(m.get("attacks") or []) for m in c.get("members",[])),"tag",x.get("tag"),x.get("state"))
              s,w=g(K+"/v2/clan/"+q(t)+"/wars?limit=2000",False)
              il=w.get("items",[]) if isinstance(w,dict) else w
              print(" v2 per maand",sorted(collections.Counter(x.get("endTime","")[:6] for x in il if x.get("endTime","")>="202606").items()),"totaal",len(il))
              s,w=g(K+"/v2/clan/"+q(t)+"/wars?limit=500&after=20261020T000000.000Z",False);print(" v2 after",s,str(w)[:120])
          s,c=g(B+"/clans/"+q("#2RGYGLVC0"));m=c["memberList"]
          n=0
          for x in m[:6]:
              s,p=g(B+"/players/"+q(x["tag"]));print(x["name"],p.get("currentLeagueGroupTag"),p.get("currentLeagueSeasonId"),p.get("previousLeagueGroupTag"),p.get("previousLeagueSeasonId"),(p.get("leagueTier") or {}).get("name"))
              if not n and p.get("previousLeagueGroupTag") and p.get("previousLeagueGroupTag")!="#0":
                  n=1
                  s,d=g(B+"/leaguegroup/"+q(p["previousLeagueGroupTag"])+"/"+str(p["previousLeagueSeasonId"]));print("groep",s,list(d.keys()) if isinstance(d,dict) else d)
                  if isinstance(d,dict):
                      for k,v in d.items():
                          print("  ",k,type(v).__name__,(len(v) if hasattr(v,"__len__") else v),json.dumps(v)[:500])
              if p.get("currentLeagueGroupTag") not in (None,"#0") and n<2:
                  n=2;s,d=g(B+"/leaguegroup/"+q(p["currentLeagueGroupTag"])+"/"+str(p["currentLeagueSeasonId"]));print("huidig",s,str(d)[:700])
              s,h=g(B+"/players/"+q(x["tag"])+"/leaguehistory");print(" hist",s,len(h.get("items",[])) if isinstance(h,dict) else h,json.dumps((h.get("items") or [None])[:2])[:520] if isinstance(h,dict) else "")
          print("EINDE")
          PY
          python3 /tmp/p.py
