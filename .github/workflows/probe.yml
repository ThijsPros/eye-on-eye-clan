name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse,time
          def g(u):
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request('https://api.clashk.ing'+u,headers={'User-Agent':'eye-on-eye'}),timeout=90))
              except Exception as e:
                  print('ERR',u,e,getattr(e,'read',lambda:b'')()[:200]);return {}
          q=lambda t:urllib.parse.quote(t,safe='')
          c=q('#PYQ2RLCQ')
          for u in [f'/v2/clan/{c}/wars?limit=2000',f'/war/{c}/previous?limit=2000',f'/war/{c}/previous?limit=2000&timestamp_end=1704067200']:
              d=g(u);i=d.get('items',d if isinstance(d,list) else []);e=[w.get('endTime') for w in i if isinstance(w,dict)]
              print('RES',u,len(i),min(e) if e else None,max(e) if e else None)
              time.sleep(1)
          P
