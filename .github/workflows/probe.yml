name: Tijdelijke controle
on: workflow_dispatch
permissions:
  contents: read
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: python scripts/_probe.py
