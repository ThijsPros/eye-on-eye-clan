name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse,time
          def g(url,show=500):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 eye-on-eye-clan','Accept':'application/json'}),timeout=40);b=r.read().decode('utf8','replace')
                  print('OK',url,r.status,len(b),b[:show].replace('\n',' '));return b
              except Exception as e:
                  print('ERR',url,e,str(getattr(e,'read',lambda:b'')()[:160]))
          t='QUYLU8C0';q=urllib.parse.quote('#'+t,safe='');p='%23PYQ2RLCQ'
          ck='https://api.clashk.ing'
          for u in [f'{ck}/v2/player/{q}/history/changes?limit=3',f'{ck}/v2/player/{q}/history/stats?limit=2',f'{ck}/v2/player/{q}/join-leave/totals']:
              g(u,350);time.sleep(.5)
          b=g(f'{ck}/clan/{p}/join-leave?limit=1000',200)
          if b:
              i=json.loads(b).get('items',[]);print('CLANJL',len(i),i[-1]['time'] if i else None,i[0]['time'] if i else None)
          b=g(f'{ck}/player/{urllib.parse.quote("#P0RRYJYCC",safe="")}/join-leave?limit=1000',150)
          if b:
              i=json.loads(b).get('items',[]);print('ZORO',len(i),i[-1]['time'] if i else None)
          for u in [f'https://api.clashofstats.com/players/{t}/history/clans',f'https://api.clashofstats.com/players/{t}/history/clans/',f'https://api.clashofstats.com/players/{t}/history',f'https://api.clashofstats.com/players/{t}',f'https://www.clashofstats.com/players/{t}/history/',f'https://www.clashofstats.com/robots.txt',f'https://clashspot.net/robots.txt',f'https://www.clashspot.net/en/player/tag/{t}/history']:
              g(u,700);time.sleep(.5)
          P
