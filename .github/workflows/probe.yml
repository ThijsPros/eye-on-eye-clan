name: Tijdelijke controle
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          T1: ${{ github.token }}
          T2: ${{ secrets.GH_DISPATCH_TOKEN }}
          R: ${{ github.repository }}
        run: |
          for t in T1 T2; do
            export GH_TOKEN="${!t}"
            echo "== sleutel $t"
            gh api repos/$R/pages --jq '{status,build_type,source}' || true
            gh api -X PUT repos/$R/pages -f 'source[branch]=main' -f 'source[path]=/' -i 2>&1 | head -1 || true
            gh api repos/$R/pages --jq '.source' || true
          done
