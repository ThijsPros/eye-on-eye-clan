name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - env:
          COC_API_KEY: ${{ secrets.COC_API_KEY }}
        run: |
          python3 - <<'P'
          import json,os,urllib.request,collections
          T='%23PYQ2RLCQ'
          ck=json.load(urllib.request.urlopen(urllib.request.Request(f'https://api.clashk.ing/v2/clan/{T}/wars?limit=500',headers={'User-Agent':'eye-on-eye'}),timeout=90))['items']
          ck=[w for w in ck if not w.get('tag')]
          f=lambda w:(w['clan'] if w['clan']['tag']=='#PYQ2RLCQ' else w['opponent'],w['opponent'] if w['clan']['tag']=='#PYQ2RLCQ' else w['clan'])
          for w in sorted(ck,key=lambda w:w['endTime'],reverse=True):
              a,b=f(w)
              if '20260401'<=w['endTime'][:8]<='20260625': print('CK',w['endTime'][:8],w.get('teamSize'),a.get('stars'),b.get('stars'),a.get('destructionPercentage'),b.get('destructionPercentage'),a.get('attacks'),b.get('attacks'))
          log=json.load(urllib.request.urlopen(urllib.request.Request(f'https://cocproxy.royaleapi.dev/v1/clans/{T}/warlog?limit=200',headers={'Authorization':'Bearer '+os.environ['COC_API_KEY']}),timeout=60))
          it=log['items'];print('LOG',len(it),log.get('paging'),collections.Counter(x['endTime'][:4] for x in it))
          print('LOGRES',collections.Counter((x.get('result'),bool((x.get('opponent') or {}).get('tag'))) for x in it))
          for x in it[:12]+it[40:62]: print('L',x['endTime'][:8],x.get('result'),x.get('teamSize'),x['clan'].get('stars'),(x.get('opponent') or {}).get('stars'),x['clan'].get('destructionPercentage'),(x.get('opponent') or {}).get('destructionPercentage'),x['clan'].get('attacks'))
          P
