name: Bronnen onderzoeken
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'P'
          import json,urllib.request,urllib.parse,time,collections
          def g(u):
              try:
                  r=urllib.request.urlopen(urllib.request.Request('https://api.clashk.ing'+u,headers={'User-Agent':'eye-on-eye'}),timeout=60);return json.load(r)
              except Exception as e:
                  print('ERR',u,e,getattr(e,'read',lambda:b'')()[:200]);return {}
          q=lambda t:urllib.parse.quote(t,safe='')
          for c in ['#PYQ2RLCQ','#2RGYGLVC0','#2JYY0809P','#2CJY8LJU0']:
              for ex in ['limit=500','type=cwl&limit=100','type=all&limit=500']:
                  d=g(f'/v2/clan/{q(c)}/wars?{ex}');it=d.get('items',[])
                  print('WARS',c,ex,len(it),[k for k in d if k!='items'],(it[-1].get('endTime'),it[0].get('endTime')) if it else None,collections.Counter((w.get('warType') or w.get('type') or ('cwl' if w.get('season') else '?'),w.get('state')) for w in it))
                  if it:
                      w=it[0];print(' KEYS',sorted(w.keys()),'opp members',len(w.get('opponent',{}).get('members',[])))
                  time.sleep(.5)
          d=g('/v2/player/'+q('#QUYLU8C0')+'/war/attacks?limit=500');it=d.get('items',[]);print('ATT',len(it),collections.Counter(a.get('warType') for a in it),it[-1]['warEndTime'] if it else None)
          d=g('/player/'+q('#QUYLU8C0')+'/join-leave?limit=1000');it=d.get('items',[]);print('JL',len(it),it[-1] if it else None)
          d=g('/clan/'+q('#2JYY0809P')+'/join-leave?limit=5000');it=d.get('items',[]);print('JLC',len(it),it[-1] if it else None)
          P
